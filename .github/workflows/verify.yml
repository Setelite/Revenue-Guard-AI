name: Verify Revenue Guard AI MVP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile backend
        run: python -m py_compile server.py
      - name: Run contract and safety tests
        run: python -m pytest -q test_server.py
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          js = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)
          Path('/tmp/revenue-guard-app.js').write_text(js[0])
          PY
          node --check /tmp/revenue-guard-app.js
