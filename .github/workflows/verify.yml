name: Verify Revenue Guard AI MVP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile backend
        run: python -m py_compile server.py main.py local_probe.py local_app.py
      - name: Run contract and safety tests
        run: python -m pytest -q test_server.py
      - name: Local Cloud.ru simulated end-to-end test (no billable tokens)
        run: python local_probe.py
      - name: Install minimal DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test mobile app interaction flow
        run: node tests/ui.test.cjs
      - name: Test lost-revenue risk workflow
        run: node tests/losses.test.cjs
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          js = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)
          Path('/tmp/revenue-guard-app.js').write_text(js[0])
          PY
          node --check /tmp/revenue-guard-app.js
