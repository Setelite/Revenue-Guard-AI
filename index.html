const icon={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 10h18"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 19v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',tag:'<path d="m11 3 10 10-8 8L3 11V3h8z"/><circle cx="7.5" cy="7.5" r="1"/>',camera:'<rect x="2" y="5" width="20" height="16" rx="4"/><circle cx="12" cy="13" r="4"/><path d="M7 5l1.5-2h7L17 5"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h6"/>',result:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',business:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/>',right:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m4 20 4-.8L19 8a2 2 0 0 0-3-3L5 16z"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true">${icon[name]||icon.spark}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
const seed={business:{name:'Студия красоты',service:'Окрашивание волос',price:4500,channel:'Telegram и VK',budget:0},campaigns:[],payments:[]};
let state;
try{let v=JSON.parse(localStorage.getItem('rg-clean-v2'));state=v?.business&&Array.isArray(v.campaigns)&&Array.isArray(v.payments)?v:structuredClone(seed)}catch(e){state=JSON.parse(JSON.stringify(seed))}

let page='home',active=null,voice=null,aiBusy=false,aiVerified=false,composerOpen=false,composerDraft='';
let aiEndpoint=localStorage.getItem('rg-ai-endpoint')||'';
let aiToken=sessionStorage.getItem('rg-ai-session-token')||'';
async function aiRequest(path,options={}){
 if(!aiEndpoint||!aiToken)throw Error('Укажите сервер и код доступа в разделе «Бизнес».');
 const url=new URL(path,aiEndpoint.replace(/\/+$/,'')+'/');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),28000);
 try{
  const response=await fetch(url.toString(),{...options,headers:{'X-Demo-Token':aiToken,...(options.headers||{})},signal:controller.signal});
  if(!response.ok){
   let detail='Ошибка сервера '+response.status;
   try{const data=await response.json();if(typeof data.detail==='string')detail=data.detail}catch(e){}
   throw Error(detail);
  }
  return await response.json();
 }finally{clearTimeout(timeout)}
}
async function verifyAI(){
 aiVerified=false;
 const label=$('aiConnectStatus');
 if(label)label.textContent='Проверяю соединение…';
 try{
  const result=await aiRequest('api/status');
  aiVerified=Boolean(result.ai_enabled);
  if(label)label.textContent=aiVerified?'Ключ найден на сервере. Проверьте генерацию задачей.':'Сервер отвечает, но ключ ИИ ещё не настроен';
  if(aiVerified)toast('Сервер настроен; проверьте генерацию');
 }catch(e){if(label)label.textContent=e.message;else toast(e.message)}
}

const now=()=>new Date().toISOString();
function save(){try{localStorage.setItem('rg-clean-v2',JSON.stringify(state))}catch(e){toast('Нет доступа к сохранению. Данные могут исчезнуть.')}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3300)}
const tabs=[['home','Главная','home'],['tasks','Идеи','spark'],['studio','Студия','camera'],['result','Результат','result']];
function nav(){const tab=page==='creative'||page==='launch'?'studio':page==='offer'?'tasks':page;const item=([id,label,ic])=>`<button type="button" data-route="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}">${svg(ic)}<span>${label}</span></button>`;$('sidenav').innerHTML=tabs.map(item).join('')+`<button type="button" data-route="business" class="${page==='business'?'active':''}">${svg('business')}<span>Настройки</span></button>`;$('bottomnav').innerHTML=tabs.map(item).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));}
function route(p,id){if(p==='studio'){const current=byId()||state.campaigns[0];if(current){p='creative';id=current.id}else{p='home';composerOpen=true;composerDraft='';}}page=p;if(id!==undefined)active=id;nav();render();window.scrollTo({top:0,behavior:'instant'});}
window.route=route;
function byId(){return state.campaigns.find(x=>x.id===active)}

async function addTask(){
 const el=$('taskText'),text=el?.value.trim();
 if(!text){toast('Опишите задачу одной фразой');el?.focus();return}
 if(aiBusy)return;
 aiBusy=true;const btn=$('createButton');if(btn){btn.disabled=true;btn.textContent='Готовлю предложения…'}
 try{
  let offers,source='demo';
  if(aiEndpoint){
   const b=state.business;
   const data={goal:text,business:{name:b.name,city:b.city||'Екатеринбург',voice:'Спокойно и понятно',channels:b.channel||'Собственные каналы',budget:Number(b.budget)||0,services:[{name:b.service,price:Number(b.price)||0,duration:0}]}};
   const output=await aiRequest('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   if(!Array.isArray(output.offers)||output.offers.length!==3)throw Error('ИИ вернул неверный формат');
   offers=output.offers.map(o=>({title:o.title,headline:o.headline,subtitle:o.reason||o.description||'',copy:o.copy||'',channel:o.channel,steps:o.steps,caution:o.caution}));
   source='ai';
  }else offers=buildOffers(text);
  const id='rg'+Date.now()+Math.random().toString(36).slice(2,6);
  const c={id,task:text,offers,selected:0,status:'draft',title:offers[0].headline||offers[0].title,copy:offers[0].copy,source,created:now(),approvedAt:null,publishedAt:null};
  state.campaigns.unshift(c);save();route('offer',id);
 }catch(e){toast('Ошибка ИИ: '+(e.name==='AbortError'?'Превышено время ожидания':e.message))}
 finally{aiBusy=false;if(btn&&document.contains(btn)){btn.disabled=false;btn.innerHTML='Найти решение '+svg('right')}}
}
window.addTask=addTask;
function buildOffers(task){
 const b=state.business, service=b.service.trim()||'услуга салона';
 const name=b.name.trim()||'салон';const s=task.toLowerCase();
 const slots=/окн|свобод|завтра|расписан|мастер/.test(s);
 const goal=slots?'Уточнить наличие записи':/нов|запуск|презент/.test(s)?'Рассказать о новой услуге':'Начать разговор с клиентом';
 return [
  {title:'Честный анонс',headline:slots?'Есть время для себя?':goal,subtitle:'Собственный канал · прямое действие',channel:b.channel||'Собственный канал',steps:['Проверить наличие времени','Согласовать текст','Опубликовать'],caution:'Перед публикацией уточнить реальные свободные часы.',copy:`В «${name}» можно записаться на ${service.toLowerCase()}. Напишите нам, и мы подскажем, какое время доступно и что входит в услугу.`},
  {title:'Один вопрос аудитории',headline:'Есть вопрос к мастеру?',subtitle:'Вовлечение · через вопросы и ответы',channel:b.channel||'Собственный канал',steps:['Выбрать частый вопрос об услуге','Подготовить ответ специалиста','Опубликовать'],caution:'Используйте только проверенные рекомендации специалиста.',copy:`Давно присматриваетесь к ${service.toLowerCase()}, но остались вопросы? Напишите их нам. Специалист «${name}» расскажет об услуге, а администратор уточнит варианты записи.`},
  {title:'За кадром профессии',headline:'Как всё устроено',subtitle:'Доверие · показать процесс без обещаний',channel:b.channel||'Собственный канал',steps:['Снять короткое видео с согласия мастера','Проверить факты и кадры','Добавить текст и опубликовать'],caution:'Не показывайте клиентов и их данные без согласия.',copy:`Что важно знать перед ${service.toLowerCase()}? Предлагаем заглянуть в рабочий процесс «${name}». Если интересно, напишите нам — расскажем об услуге и условиях записи.`}
 ];
}

function home(){return `<div class="eyebrow">REVENUE GUARD · AI STUDIO</div><h1 class="h1">Ваш бизнес.<br><em>Ваша следующая идея.</em></h1><p class="lead">Одна задача — три способа привлечь клиентов. Без лишней работы и пустых обещаний.</p><div class="largebox"><div class="voice-input"><textarea id="taskText" aria-label="Коммерческая задача" placeholder="Например: завтра у мастера свободное время. Хочу привлечь клиентов без скидок."></textarea><button id="voiceButton" class="round" type="button" title="Продиктовать задачу" aria-label="Продиктовать задачу">${svg('mic')}</button></div><div class="actions"><button type="button" class="primary wide" id="createButton">Найти решение ${svg('right')}</button></div><div class="hint" id="voiceStatus">Напишите задачу или продиктуйте её.</div></div><div class="section"><h3>Попробуйте с этого</h3><div class="chips"><button class="chip" data-example="Хочу заполнить свободные часы завтра без скидок. Предложи три разных способа.">Свободные часы</button><button class="chip" data-example="Хочу рассказать о новой услуге и получить заявки без обещаний и скидок.">Новая услуга</button><button class="chip" data-example="Хочу вернуть внимание постоянных клиентов без рассылок.">Повторные визиты</button></div></div>${state.campaigns.length?`<div class="section"><div class="spread"><h3>Продолжить работу</h3><button class="ghost" data-go="tasks">Все задачи →</button></div>${campaignRow(state.campaigns[0])}</div>`:''}<div class="tagline">${aiEndpoint?(aiVerified?'Сервер настроен · настоящий ИИ проверяется созданием задачи':'Сервер указан. Проверьте подключение в разделе «Бизнес».'):'Демо без расходов: идеи создаются локально по шаблонам. Для реального ИИ подключите сервер в разделе «Бизнес».'}</div>`}
function campaignRow(c){const d=new Date(c.created);const date=isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});const label={draft:'Выбор идеи',chosen:'Креатив',approved:'Утверждено',published:'Размещено'}[c.status]||'В работе';return `<button class="taskrow" data-open="${esc(c.id)}"><span><span class="name">${esc(c.title||c.task)}</span><span class="sub">${date} · ${label}</span></span><span class="chevron">›</span></button>`}
function tasks(){return `<h1 class="h1">Ваши задачи</h1><p class="lead">От идеи до результата — всё в одном месте.</p><div class="section">${state.campaigns.length?state.campaigns.map(campaignRow).join(''):`<div class="empty"><strong>Пока нет задач</strong>Создайте первую на главном экране.<div class="space"></div><button class="primary" data-go="home">Поставить задачу</button></div>`}</div>`}
function offer(){const c=byId();if(!c)return tasks();const o=c.offers[c.selected];return `<button class="back" data-go="tasks">‹ К задачам</button><div class="step">01 / 03 · ВЫБОР СТРАТЕГИИ</div><h1 class="h1">Три идеи.<br><em>Одна цель.</em></h1><p class="lead">Выберите подход — текст и сторис соберутся в следующем шаге.</p><div class="section">${c.offers.map((x,i)=>`<div class="offer ${c.selected===i?'active':''}" role="button" tabindex="0" data-select="${i}" aria-pressed="${c.selected===i}"><div class="offerhead"><div style="flex:1"><div class="offer-num">ВАРИАНТ 0${i+1}</div><h3>${esc(x.title)}</h3><p>${esc(x.subtitle)}</p></div><span class="radio"></span></div></div>`).join('')}</div><div class="card"><div class="step">ГОТОВЫЙ ТЕКСТ</div><p style="font-size:19px;line-height:1.6;margin:0 0 14px">${esc(o.copy)}</p>${o.caution?`<div class="offer-details">${esc(o.caution)}</div>`:''}</div><div class="actions"><button class="primary wide" id="selectOffer">Создать креатив ${svg('right')}</button></div><div class="hint">${c.source==='ai'?'Сгенерировано ИИ.':'Демо: создано локально.'} Проверьте все утверждения перед публикацией.</div>`}
function creative(){const c=byId();if(!c)return tasks();const theme=c.posterTheme||'pearl';return `<button class="back" data-go="tasks">‹ К идеям</button><div class="step">02 / 03 · CREATIVE STUDIO</div><h1 class="h1">Готовый<br><em>визуальный язык.</em></h1><p class="lead">Выберите настроение, отредактируйте текст и скачайте сторис в высоком качестве.</p><div class="section grid2 creative-layout"><div class="creative-fields"><div class="field"><label class="label" for="offerTitle">Короткий заголовок</label><input id="offerTitle" maxlength="100" value="${esc(c.title)}"></div><div class="field"><label class="label" for="offerCopy">Текст поста</label><textarea id="offerCopy" maxlength="800">${esc(c.copy)}</textarea></div><div class="actions"><button class="secondary wide" id="copyOffer">${svg('copy')} Скопировать текст</button><button class="primary wide" id="downloadStory">${svg('download')} Скачать сторис 1080 × 1920</button></div><div class="hint">Это дизайнерский постер, не фотография, сгенерированная нейросетью.</div></div><div class="creative-preview"><div class="preview-label">Ваш креатив</div><div class="preview theme-${esc(theme)}" id="storyPreview"><div class="topline">${esc(state.business.name)}</div><div class="hero" id="storyTitle">${esc(c.title)}</div><div class="bottomline">Уточните детали и запись в сообщениях</div></div><div class="theme-switcher"><button class="theme-choice ${theme==='pearl'?'active':''}" data-theme="pearl"><span class="swatch"></span> Pearl</button><button class="theme-choice ${theme==='ink'?'active':''}" data-theme="ink"><span class="swatch ink"></span> Ink</button><button class="theme-choice ${theme==='sunset'?'active':''}" data-theme="sunset"><span class="swatch sunset"></span> Sunset</button></div></div></div><div class="section"><div class="notice">Ничего не публикуется автоматически. Проверьте факты, согласуйте оффер и запустите его самостоятельно.</div><div class="actions"><button class="primary wide" id="approveOffer">${c.status==='approved'||c.status==='published'?'К кампании':'Утвердить и продолжить'} ${svg('right')}</button></div></div>`}
function launch(){const c=byId();if(!c)return tasks();const approved=c.status==='approved'||c.status==='published';return `<button class="back" data-go="tasks">‹ Назад к задачам</button><div class="step">Шаг 3 из 3</div><h1 class="h1">${c.status==='published'?'Кампания запущена':'Почти готово'}</h1><p class="lead">${approved?'Теперь можно размещать материалы и отмечать реальные продажи.':'Сначала утвердите предложение.'}</p><div class="section card"><span class="status ${approved?'good':''}">${c.status==='published'?'Размещено':approved?'Утверждено':'Требует утверждения'}</span><h2 style="font-size:25px;letter-spacing:-.03em;line-height:1.2;margin:16px 0">${esc(c.title)}</h2><p style="color:#6b7078;margin:0">${esc(c.copy)}</p><hr class="line"><p class="small">Размещайте предложение только в разрешённых каналах бизнеса. После публикации отметьте это здесь.</p>${c.status==='approved'?`<button id="markPublished" class="primary wide">Отметить публикацию</button>`:''}${c.status!=='published'?`<button class="secondary wide" style="margin-top:10px" data-go="creative" data-id="${esc(c.id)}">Изменить материалы</button>`:''}</div>${c.status==='published'?`<div class="section"><h3>Учёт реальных продаж</h3><div class="card"><label class="label" for="paidAmount">Полученная оплата, ₽</label><input id="paidAmount" type="number" min="1" max="100000000" inputmode="numeric" placeholder="Например, 4500"><div class="space"></div><button class="primary wide" id="addPayment">${svg('plus')} Добавить оплату</button></div><div class="hint">Добавляйте только реальные оплаты, подтверждённые салоном. По умолчанию связь с кампанией не доказывает причинный эффект.</div></div>`:''}`}
function results(){let total=state.payments.reduce((a,b)=>a+Number(b.amount||0),0),published=state.campaigns.filter(c=>c.status==='published').length;return `<h1 class="h1">Результат<br>в цифрах</h1><p class="lead">Только подтверждённые вручную данные, без прогнозов и выдуманной аналитики.</p><div class="section grid2"><div class="stat"><div class="kpi">${state.payments.length}</div><div class="kpi-label">Оплаченных визитов</div></div><div class="stat"><div class="kpi">${fmt(total)}</div><div class="kpi-label">Учтённая выручка</div></div></div><div class="section"><h3>Кампании</h3><div class="metricrow"><span>Отмечены как размещённые</span><strong>${published}</strong></div><div class="metricrow"><span>Всего создано</span><strong>${state.campaigns.length}</strong></div></div><div class="section"><h3>Последние оплаты</h3>${state.payments.length?state.payments.slice(0,8).map(p=>`<div class="metricrow"><span>${esc(p.title)}<div class="small">${new Date(p.date).toLocaleDateString('ru-RU')}</div></span><strong>${fmt(p.amount)}</strong></div>`).join(''):`<div class="empty">Пока нет зарегистрированных оплат.</div>`}</div><div class="section notice">Учтённая выручка — это сумма внесённых вами платежей. Это не автоматически доказанная дополнительная прибыль.</div>`}
function business(){const b=state.business;return `<h1 class="h1">Мой бизнес</h1><p class="lead">Данные, на основе которых готовятся предложения.</p><form id="bizForm" class="section card"><div class="field"><label class="label" for="bizName">Название салона</label><input id="bizName" maxlength="90" required value="${esc(b.name)}"></div><div class="field"><label class="label" for="bizService">Основная услуга</label><input id="bizService" maxlength="100" required value="${esc(b.service)}"></div><div class="field"><label class="label" for="bizPrice">Средняя стоимость услуги, ₽</label><input id="bizPrice" type="number" min="1" max="100000000" required value="${Number(b.price)}"></div><div class="field"><label class="label" for="bizChannels">Каналы связи</label><input id="bizChannels" maxlength="130" value="${esc(b.channel)}"></div><div class="field"><label class="label" for="bizBudget">Рекламный бюджет, ₽</label><input id="bizBudget" type="number" min="0" max="100000000" value="${Number(b.budget)||0}"></div><button class="primary wide" type="submit">Сохранить изменения</button></form><div class="section card"><h3 style="font-size:23px;margin:0 0 8px">Подключение ИИ</h3><p class="help">Нужен собственный HTTPS-сервер с Cloud.ru. API-ключ Cloud.ru сюда не вводите.</p><div class="field"><label class="label" for="aiEndpoint">HTTPS-адрес сервера</label><input id="aiEndpoint" type="url" placeholder="https://api.example.ru/" autocomplete="off" value="${esc(aiEndpoint)}"></div><div class="field"><label class="label" for="aiToken">Код доступа</label><input id="aiToken" type="password" placeholder="Код демосервера" autocomplete="off" value="${esc(aiToken)}"></div><button type="button" id="connectAI" class="secondary wide">Проверить подключение</button><div class="hint" id="aiConnectStatus">${aiVerified?'Настройки сервера найдены':'Сервер пока не проверен'}</div></div><div class="section"><p class="help">Приложение работает в демонстрационном режиме. Не вводите персональные данные клиентов.</p><button type="button" class="ghost danger" id="resetDemo">Очистить демонстрационные данные</button></div>`}
function render(){nav();$('salonName').textContent=state.business.name;const views={home,tasks,offer,creative,launch,result:results,business};$('view').innerHTML=(views[page]||home)();$('settingsOpen').onclick=()=>route('business');wire();}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.go,b.dataset.id)));document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const c=state.campaigns.find(x=>x.id===b.dataset.open);route(c.status==='draft'?'offer':c.status==='chosen'?'creative':'launch',c.id)}));document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>addShort(b.dataset.example));if(page==='home'){$('createButton').onclick=addTask;$('voiceButton').onclick=startVoice;}if(page==='offer'){document.querySelectorAll('[data-select]').forEach(o=>{const choose=()=>{const c=byId();c.selected=Number(o.dataset.select);c.title=c.offers[c.selected].headline||c.offers[c.selected].title;c.copy=c.offers[c.selected].copy;save();render()};o.onclick=choose;o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});$('selectOffer').onclick=()=>{let c=byId();if(c.status==='draft')c.status='chosen';save();route('creative',c.id)}}if(page==='creative'){const c=byId(),title=$('offerTitle'),copy=$('offerCopy');document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{c.posterTheme=b.dataset.theme;save();document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b));$('storyPreview').className='preview theme-'+c.posterTheme});const sync=()=>{c.title=title.value;c.copy=copy.value;save();$('storyTitle').textContent=c.title};title.oninput=sync;copy.oninput=sync;$('copyOffer').onclick=()=>copyText(`${title.value}\n\n${copy.value}`);$('downloadStory').onclick=()=>storyPNG(c);$('approveOffer').onclick=()=>{if(!c.title.trim()||!c.copy.trim()){toast('Добавьте заголовок и текст');return}c.status='approved';c.approvedAt=now();save();route('launch',c.id)}}if(page==='launch'){const c=byId();if($('markPublished'))$('markPublished').onclick=()=>{c.status='published';c.publishedAt=now();save();render()};if($('addPayment'))$('addPayment').onclick=()=>{const n=Number($('paidAmount').value);if(!Number.isFinite(n)||n<=0||n>100000000){toast('Укажите корректную сумму оплаты');return}state.payments.unshift({id:'p'+Date.now(),campaignId:c.id,title:c.title,amount:Math.round(n*100)/100,date:now()});save();toast('Оплата добавлена');route('result')}}if(page==='business'){$('bizForm').onsubmit=e=>{e.preventDefault();const b=state.business;b.name=$('bizName').value.trim()||'Мой бизнес';b.service=$('bizService').value.trim()||'Услуги';b.price=Number($('bizPrice').value)||0;b.channel=$('bizChannels').value.trim();b.budget=Number($('bizBudget').value)||0;save();toast('Изменения сохранены');render()};$('connectAI').onclick=async()=>{
 const raw=$('aiEndpoint').value.trim().replace(/\/+$/,''),token=$('aiToken').value.trim();
 if(raw){
  let u;try{u=new URL(raw)}catch(e){toast('Неверный адрес сервера');return}
  if(u.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(u.hostname)){toast('Для сервера нужен HTTPS');return}
  if(u.username||u.password||u.search||u.hash){toast('Введите только базовый адрес сервера');return}
 }
 aiEndpoint=raw;aiToken=token;aiVerified=false;
 localStorage.setItem('rg-ai-endpoint',aiEndpoint);sessionStorage.setItem('rg-ai-session-token',aiToken);
 if(!raw){$('aiConnectStatus').textContent='Демо-режим';return}
 await verifyAI();
};$('resetDemo').onclick=()=>{if(confirm('Удалить все задачи и оплаты на этом устройстве?')){state=JSON.parse(JSON.stringify(seed));save();route('home')}}}}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Текст скопирован')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Текст скопирован')}catch(e){toast('Не удалось скопировать автоматически')}el.remove()}
function startVoice(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('В этом браузере голос недоступен. Напишите задачу текстом.');return}if(voice){try{voice.stop()}catch(e){}voice=null;return}const rec=new Speech();voice=rec;rec.lang='ru-RU';rec.interimResults=false;rec.maxAlternatives=1;const btn=$('voiceButton');btn.classList.add('recording');$('voiceStatus').textContent='Слушаю… скажите вашу задачу.';rec.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';$('taskText').value=($('taskText').value+' '+text).trim();$('voiceStatus').textContent='Проверьте текст и нажмите «Подготовить предложение».'};rec.onerror=()=>{toast('Не получилось распознать речь. Попробуйте написать.');};rec.onend=()=>{voice=null;btn.classList.remove('recording');if($('voiceStatus')?.textContent.includes('Слушаю'))$('voiceStatus').textContent='Можно написать или нажать на микрофон.'};try{rec.start()}catch(e){voice=null;btn.classList.remove('recording');toast('Микрофон недоступен. Введите текст.')}}
function storyPNG(c){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;
 const cx=canvas.getContext('2d');const theme=c.posterTheme||'pearl';
 const palette={pearl:['#dcebf0','#789fa8','#233b44','#f3f5eb'],ink:['#15231f','#506f60','#f7e8c9','#b99c6a'],sunset:['#ffeadc','#da8d7f','#59372f','#f9d79c']}[theme]||['#dcebf0','#789fa8','#233b44','#f3f5eb'];
 const bg=cx.createLinearGradient(0,0,650,1920);bg.addColorStop(0,palette[0]);bg.addColorStop(1,palette[1]);cx.fillStyle=bg;cx.fillRect(0,0,1080,1920);
 const ball=cx.createRadialGradient(780,600,18,860,930,515);ball.addColorStop(0,palette[3]);ball.addColorStop(.55,palette[1]);ball.addColorStop(1,palette[0]);cx.shadowColor='#122b3340';cx.shadowBlur=75;cx.fillStyle=ball;cx.beginPath();cx.arc(915,930,475,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
 cx.fillStyle=palette[2];cx.font='bold 40px Arial,sans-serif';cx.fillText(state.business.name.slice(0,37),85,160);
 cx.strokeStyle=palette[2];cx.globalAlpha=.35;cx.lineWidth=2;cx.beginPath();cx.moveTo(85,1550);cx.lineTo(995,1550);cx.stroke();cx.globalAlpha=1;
 let size=104;cx.font='bold '+size+'px Arial,sans-serif';const title=String(c.title||'Ваше предложение');if(title.length>70)size=82;cx.font='bold '+size+'px Arial,sans-serif';
 wrapCanvas(cx,title,85,585,905,size*1.18,7);
 cx.font='600 40px Arial,sans-serif';wrapCanvas(cx,'Уточните детали и запись в сообщениях',85,1675,900,59,3);
 cx.font='600 28px Arial,sans-serif';cx.globalAlpha=.65;cx.fillText('REVENUE GUARD · CREATIVE STUDIO',85,1845);cx.globalAlpha=1;
 canvas.toBlob(blob=>{if(!blob){toast('Не удалось создать постер');return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Revenue-Guard-'+theme+'-story.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Сторис 1080 × 1920 готова')},'image/png')
}
function wrapCanvas(ctx,text,x,y,maxW,lineH,maxLines){let words=String(text).split(/\s+/),line='',lines=[];for(let word of words){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);let n=0;for(let s of lines){if(n>=maxLines)break;if(ctx.measureText(s).width>maxW){while(ctx.measureText(s).width>maxW&&s.length>1)s=s.slice(0,-1);s+='…'}ctx.fillText(s,x,y+n*lineH);n++}}
render();
})();
