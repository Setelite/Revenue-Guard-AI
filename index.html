<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:#1b1e22;background:#fafaf8;font-synthesis:none;font-weight:400;--paper:#fafaf8;--card:#fff;--ink:#1b1e22;--muted:#777c83;--line:#e6e6e2;--blue:#284fef;--blue-dark:#1d3dc5;--radius:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-size:17px;line-height:1.48;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:not-allowed;opacity:.48}a{color:inherit}input,textarea,select{color:var(--ink);width:100%;padding:17px 18px;border:1px solid #d8dadb;border-radius:17px;outline:none;background:#fff;font-size:17px}textarea{min-height:140px;resize:vertical;line-height:1.5}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(40,79,239,.10)}button:focus-visible,a:focus-visible{outline:3px solid rgba(40,79,239,.43);outline-offset:3px}.layout{min-height:100vh;display:flex;max-width:1500px;margin:auto}.side{width:260px;min-height:100vh;border-right:1px solid var(--line);padding:38px 25px;display:flex;flex-direction:column;gap:55px;position:sticky;top:0;align-self:start}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:750;font-size:21px;letter-spacing:-.9px;white-space:nowrap}.logo{width:39px;height:39px;border-radius:13px;background:#212836;color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;letter-spacing:-1px}.nav{display:flex;flex-direction:column;gap:9px}.nav button{border:0;background:transparent;text-align:left;display:flex;gap:13px;align-items:center;padding:15px 15px;border-radius:14px;color:#656a70;font-size:16px;font-weight:570}.nav button.active{background:#eaeefc;color:#2349e8}.nav svg,.bottom svg{width:21px;height:21px;stroke-width:1.9}.primary svg,.secondary svg{width:21px;height:21px;flex:none;stroke-width:2}.sidefoot{margin-top:auto;color:#858a90;font-size:13px;line-height:1.6}.main{width:100%;max-width:1080px;padding:64px clamp(20px,6vw,92px) 96px}.top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:39px;gap:20px}.top .brand{display:none}.eyebrow{font-size:13px;font-weight:720;letter-spacing:.12em;text-transform:uppercase;color:#91969b}.owner{font-size:15px;color:#81858b}.h1{font-size:clamp(35px,4vw,58px);line-height:1.08;letter-spacing:-.055em;max-width:800px;margin:0 0 15px;font-weight:730}.h2{font-size:clamp(28px,3.4vw,42px);line-height:1.15;letter-spacing:-.045em;margin:0 0 13px;font-weight:700}.lead{font-size:19px;color:#6e7479;max-width:570px;line-height:1.48;margin:0}.section{margin-top:40px}.section h3{font-size:22px;margin:0 0 16px;letter-spacing:-.025em}.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:26px}.primary{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:17px;padding:16px 20px;font-weight:660;min-height:57px;display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.25}.primary:hover{background:var(--blue-dark)}.secondary{border:1px solid #d9dce0;background:#fff;color:#282c31;border-radius:17px;padding:15px 19px;font-weight:620;min-height:57px;display:inline-flex;align-items:center;justify-content:center;gap:10px}.ghost{border:0;color:var(--blue);background:transparent;padding:10px;font-weight:660;font-size:16px}.wide{width:100%}.small{font-size:14px;color:#7c8187}.space{height:18px}.largebox{margin-top:35px;padding:27px;background:white;border:1px solid var(--line);border-radius:27px}.voice-input{display:flex;gap:13px;align-items:flex-end}.voice-input textarea{flex:1;min-height:115px;font-size:18px;padding:16px;border-color:transparent;background:#f5f6f4}.round{border:0;border-radius:20px;background:#edf0ff;color:var(--blue);width:62px;height:62px;flex:none;display:grid;place-items:center}.round svg{width:27px;height:27px}.round.recording{background:#ffedef;color:#cc3345;animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(201,48,65,.08)}}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:17px}.hint{color:#858a91;font-size:14px;margin-top:12px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.chip{border:1px solid #e2e4e5;color:#4a5158;background:white;border-radius:40px;padding:11px 15px;font-size:15px}.line{border:0;border-top:1px solid var(--line);margin:24px 0}.taskrow{display:flex;gap:17px;align-items:center;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:22px;padding:21px 22px;margin-bottom:10px;text-align:left;width:100%}.taskrow .name{font-weight:650;font-size:19px;line-height:1.25}.taskrow .sub{color:#85898f;font-size:14px;margin-top:7px}.chevron{color:#a0a4aa;font-size:27px;line-height:1}.muted{color:#888e94}.back{border:0;background:none;padding:8px 0;color:#6a7078;font-size:15px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.step{text-transform:uppercase;font-size:12px;letter-spacing:.12em;font-weight:740;color:#8a9096;margin-bottom:16px}.offer{border:1.5px solid #e2e4e6;background:#fff;border-radius:24px;padding:23px;margin-bottom:12px;cursor:pointer;transition:border-color .15s ease}.offer.active{border:2px solid var(--blue);padding:22.5px;background:#f8f9ff}.offer h3{font-size:21px;letter-spacing:-.025em;margin:4px 0 8px}.offer p{margin:0;color:#727981;line-height:1.5}.radio{width:25px;height:25px;flex:none;border:2px solid #ccd0d3;border-radius:50%;display:grid;place-items:center}.active .radio{border-color:var(--blue)}.active .radio:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--blue)}.offerhead{display:flex;gap:15px}.label{display:block;margin-bottom:9px;font-weight:650;font-size:15px}.field{margin:18px 0}.preview{aspect-ratio:9/13;max-width:360px;min-height:360px;background:linear-gradient(160deg,#e6eeff 0%,#d9e0fa 40%,#a0adf1 100%);display:flex;flex-direction:column;justify-content:space-between;padding:33px;border-radius:23px;overflow:hidden;position:relative;color:#18234a}.preview:before{content:"";width:260px;height:260px;border:50px solid rgba(255,255,255,.17);border-radius:50%;position:absolute;right:-90px;top:110px}.preview .topline{z-index:1;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:750}.preview .hero{z-index:1;font-size:clamp(28px,3vw,42px);line-height:1.1;letter-spacing:-.05em;font-weight:780;max-width:280px;overflow-wrap:anywhere}.preview .bottomline{z-index:1;font-size:15px;font-weight:600;max-width:260px;overflow-wrap:anywhere}.kpi{font-size:clamp(35px,4vw,52px);letter-spacing:-.06em;font-weight:750;line-height:1.05}.kpi-label{font-size:15px;color:#858a8f;margin-top:9px}.stat{background:#fff;padding:25px;border:1px solid var(--line);border-radius:24px}.subhead{font-size:16px;color:#7a8086;margin:16px 0 24px}.status{font-size:13px;color:#686f76;border:1px solid #e5e6e6;background:#f7f8f8;padding:6px 10px;border-radius:30px;display:inline-block}.status.good{background:#eff9f3;color:#17683d;border-color:#dbeee0}.notice{padding:16px 19px;border-radius:18px;background:#f1f2ef;color:#6b7176;font-size:15px;line-height:1.5}.empty{padding:44px 20px;text-align:center;background:#fff;border:1px dashed #d5d8d9;border-radius:24px;color:#81878d}.empty strong{display:block;font-size:21px;margin-bottom:9px;color:#2d333a}.metricrow{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 0;border-bottom:1px solid var(--line);font-size:16px}.metricrow strong{font-size:19px;white-space:nowrap}.bottom{display:none}.flex{display:flex;gap:14px;align-items:center}.spread{display:flex;justify-content:space-between;align-items:center;gap:15px}.tagline{margin:20px 0;color:#7e848a;font-size:15px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;max-width:calc(100vw - 40px);width:max-content;background:#202832;color:white;border-radius:15px;padding:14px 20px;box-shadow:0 18px 48px #20283233;font-size:15px;z-index:30;display:none}.toast.show{display:block}.danger{color:#af353d}.result-card{padding:20px 0;border-bottom:1px solid var(--line)}.result-card:last-child{border-bottom:0}.pillrow{display:flex;gap:9px;align-items:center}.help{font-size:14px;color:#868b90}.desktop-only{display:block}#view{animation:fade .17s ease}@keyframes fade{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:950px){.side{width:215px;padding:29px 16px}.main{padding:43px 26px 100px}}
@media(max-width:720px){body{font-size:17px}.layout{display:block}.side{display:none}.main{padding:24px 19px 116px;max-width:600px;margin:auto}.top{margin-bottom:29px;justify-content:space-between}.top .brand{display:flex;font-size:18px}.top .logo{width:34px;height:34px;border-radius:11px;font-size:14px}.owner{font-size:13px}.h1{font-size:38px;line-height:1.1;letter-spacing:-.053em;margin-bottom:14px}.h2{font-size:32px}.lead{font-size:18px}.largebox{margin-top:25px;padding:19px;border-radius:22px}.voice-input{gap:10px}.voice-input textarea{min-height:148px;font-size:18px}.round{width:53px;height:53px;border-radius:17px}.card{padding:20px;border-radius:21px}.section{margin-top:31px}.section h3{font-size:21px}.grid2{grid-template-columns:1fr;gap:11px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around;backdrop-filter:blur(20px)}.bottom button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px;min-height:54px;background:transparent;border:0;color:#94999e;font-size:12px;padding:4px 5px}.bottom button.active{color:var(--blue);font-weight:700}.nav svg,.bottom svg{width:24px;height:24px}.taskrow{padding:20px 17px}.taskrow .name{font-size:18px}.preview{max-width:100%}.toast{bottom:95px}.desktop-only{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <a href="#" class="brand" onclick="window.route('home');return false"><span class="logo">RG</span>Revenue Guard</a>
    <nav class="nav" id="sidenav"></nav>
    <div class="sidefoot">Демонстрация продукта<br>Данные хранятся только<br>на этом устройстве.</div>
  </aside>
  <main class="main">
    <header class="top"><a href="#" class="brand" onclick="window.route('home');return false"><span class="logo">RG</span><span class="desktop-only">Revenue Guard</span><span class="mobile-brand" style="display:none">Revenue Guard</span></a><span class="owner" id="salonName">Студия красоты</span></header>
    <div id="view"></div>
  </main>
</div>
<nav id="bottomnav" class="bottom" aria-label="Разделы приложения"></nav>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const icon={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h6"/>',result:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',business:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/>',right:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m4 20 4-.8L19 8a2 2 0 0 0-3-3L5 16z"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true">${icon[name]||icon.spark}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
const seed={business:{name:'Студия красоты',service:'Окрашивание волос',price:4500,channel:'Telegram и VK',budget:0},campaigns:[],payments:[]};
let state;
try{let v=JSON.parse(localStorage.getItem('rg-clean-v2'));state=v?.business&&Array.isArray(v.campaigns)&&Array.isArray(v.payments)?v:structuredClone(seed)}catch(e){state=JSON.parse(JSON.stringify(seed))}

let page='home',active=null,voice=null,aiBusy=false,aiVerified=false;
let aiEndpoint=localStorage.getItem('rg-ai-endpoint')||'';
let aiToken=sessionStorage.getItem('rg-ai-session-token')||'';
async function aiRequest(path,options={}){
 if(!aiEndpoint||!aiToken)throw Error('Укажите сервер и код доступа в разделе «Бизнес».');
 const url=new URL(path,aiEndpoint.replace(/\/+$/,'')+'/');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),28000);
 try{
  const response=await fetch(url.toString(),{...options,headers:{'X-Demo-Token':aiToken,...(options.headers||{})},signal:controller.signal});
  if(!response.ok){
   let detail='Ошибка сервера '+response.status;
   try{const data=await response.json();if(typeof data.detail==='string')detail=data.detail}catch(e){}
   throw Error(detail);
  }
  return await response.json();
 }finally{clearTimeout(timeout)}
}
async function verifyAI(){
 aiVerified=false;
 const label=$('aiConnectStatus');
 if(label)label.textContent='Проверяю соединение…';
 try{
  const result=await aiRequest('api/status');
  aiVerified=Boolean(result.ai_enabled);
  if(label)label.textContent=aiVerified?'ИИ подключён':'Сервер отвечает, но ключ ИИ ещё не настроен';
  if(aiVerified)toast('ИИ подключён');
 }catch(e){if(label)label.textContent=e.message;else toast(e.message)}
}

const now=()=>new Date().toISOString();
function save(){try{localStorage.setItem('rg-clean-v2',JSON.stringify(state))}catch(e){toast('Нет доступа к сохранению. Данные могут исчезнуть.')}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3300)}
const tabs=[['home','Сегодня','home'],['tasks','Задачи','tasks'],['result','Результат','result'],['business','Бизнес','business']];
function nav(){const item=([id,label,ic])=>`<button type="button" data-route="${id}" class="${page===id?'active':''}" aria-current="${page===id?'page':'false'}">${svg(ic)}<span>${label}</span></button>`;$('sidenav').innerHTML=tabs.map(item).join('');$('bottomnav').innerHTML=tabs.map(item).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));}
function route(p,id){page=p;if(id!==undefined)active=id;nav();render();window.scrollTo({top:0,behavior:'instant'});}
window.route=route;
function byId(){return state.campaigns.find(x=>x.id===active)}

async function addTask(){
 const el=$('taskText'),text=el?.value.trim();
 if(!text){toast('Опишите задачу одной фразой');el?.focus();return}
 if(aiBusy)return;
 aiBusy=true;const btn=$('createButton');if(btn){btn.disabled=true;btn.textContent='Готовлю предложения…'}
 try{
  let offers,source='demo';
  if(aiEndpoint){
   const b=state.business;
   const data={goal:text,business:{name:b.name,city:b.city||'Екатеринбург',voice:'Спокойно и понятно',channels:b.channel||'Собственные каналы',budget:Number(b.budget)||0,services:[{name:b.service,price:Number(b.price)||0,duration:0}]}};
   const output=await aiRequest('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   if(!Array.isArray(output.offers)||output.offers.length!==3)throw Error('ИИ вернул неверный формат');
   offers=output.offers.map(o=>({title:o.title,subtitle:o.reason||o.description||'',copy:o.copy||'',channel:o.channel,steps:o.steps,caution:o.caution}));
   source='ai';
  }else offers=buildOffers(text);
  const id='rg'+Date.now()+Math.random().toString(36).slice(2,6);
  const c={id,task:text,offers,selected:0,status:'draft',title:offers[0].title,copy:offers[0].copy,source,created:now(),approvedAt:null,publishedAt:null};
  state.campaigns.unshift(c);save();route('offer',id);
 }catch(e){toast('Ошибка ИИ: '+(e.name==='AbortError'?'Превышено время ожидания':e.message))}
 finally{aiBusy=false;if(btn&&document.contains(btn)){btn.disabled=false;btn.innerHTML='Подготовить предложение '+svg('right')}}
}
window.addTask=addTask;
function buildOffers(task){const b=state.business;const service=b.service.trim()||'услугу салона';const s=task.toLowerCase();let theme='Знакомство с услугой';if(/окн|свобод|завтра|расписан|мастер/.test(s))theme='Свободное время у мастера';else if(/нов|запуск|презент/.test(s))theme='Новая услуга';else if(/верн|постоян|повтор/.test(s))theme='Повторный визит';const prefix=theme==='Свободное время у мастера'?'Появилось свободное время':theme==='Новая услуга'?'Знакомьтесь, новая услуга':theme==='Повторный визит'?'Пора порадовать себя':'Откройте для себя';return [
{title:theme,subtitle:'Простой и понятный анонс',copy:`${prefix}: ${service.toLowerCase()} в «${b.name}». Уточните доступное время и запишитесь в сообщениях салона.`},
{title:'Персональное приглашение',subtitle:'Без скидок и громких обещаний',copy:`Хотите записаться на ${service.toLowerCase()}? Напишите в «${b.name}» — расскажем подробности и предложим удобное время.`},
{title:'Знакомство с мастером',subtitle:'Акцент на доверии',copy:`Рассказываем о ${service.toLowerCase()} и поможем выбрать подходящий формат. Задайте вопрос мастеру «${b.name}» — ответим и уточним запись.`}];}
function addShort(text){$('taskText').value=text;$('taskText').focus();}
window.addShort=addShort;
function home(){const open=state.campaigns.filter(x=>x.status!=='published').length;return `<div class="eyebrow">Ваш коммерческий помощник</div><h1 class="h1">Какая задача<br>сегодня?</h1><p class="lead">Расскажите, чего хотите добиться. Мы подготовим предложение и материалы для запуска.</p><div class="largebox"><div class="voice-input"><textarea id="taskText" aria-label="Коммерческая задача" placeholder="Например: завтра три свободных часа у мастера. Помоги найти клиентов."></textarea><button id="voiceButton" class="round" type="button" title="Продиктовать задачу" aria-label="Продиктовать задачу">${svg('mic')}</button></div><div class="actions"><button type="button" class="primary wide" id="createButton">Подготовить предложение ${svg('right')}</button></div><div class="hint" id="voiceStatus">Можно написать или нажать на микрофон.</div></div><div class="section"><h3>С чего начать</h3><div class="chips"><button class="chip" data-example="У меня завтра свободные окна. Нужно найти клиентов без скидок.">Заполнить свободные окна</button><button class="chip" data-example="Хочу рассказать клиентам о новой услуге и получить первые заявки.">Продвинуть новую услугу</button><button class="chip" data-example="Хочу вернуть постоянных клиентов без навязчивых рассылок.">Вернуть клиентов</button></div></div>${state.campaigns.length?`<div class="section"><div class="spread"><h3>Последняя задача</h3><button class="ghost" data-go="tasks">Все задачи →</button></div>${campaignRow(state.campaigns[0])}</div>`:''}<div class="tagline">${aiEndpoint?(aiVerified?'Настоящий ИИ подключён':'Адрес ИИ указан. Проверьте соединение в разделе «Бизнес».'):'Демо-режим: шаблонные предложения. Подключение ИИ — в разделе «Бизнес».'}</div>`}
function campaignRow(c){const d=new Date(c.created);const date=isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});const label={draft:'Выбор идеи',chosen:'Креатив',approved:'Утверждено',published:'Размещено'}[c.status]||'В работе';return `<button class="taskrow" data-open="${esc(c.id)}"><span><span class="name">${esc(c.title||c.task)}</span><span class="sub">${date} · ${label}</span></span><span class="chevron">›</span></button>`}
function tasks(){return `<h1 class="h1">Ваши задачи</h1><p class="lead">От идеи до результата — всё в одном месте.</p><div class="section">${state.campaigns.length?state.campaigns.map(campaignRow).join(''):`<div class="empty"><strong>Пока нет задач</strong>Создайте первую на главном экране.<div class="space"></div><button class="primary" data-go="home">Поставить задачу</button></div>`}</div>`}
function offer(){const c=byId();if(!c)return tasks();return `<button class="back" data-go="tasks">‹ Назад к задачам</button><div class="step">Шаг 1 из 3</div><h1 class="h1">Выберите идею</h1><p class="lead">Три варианта для вашей задачи. Подберите тот, который ближе вашему салону.</p><div class="section">${c.offers.map((o,i)=>`<div class="offer ${c.selected===i?'active':''}" role="button" tabindex="0" data-select="${i}" aria-pressed="${c.selected===i}"><div class="offerhead"><span class="radio"></span><div><h3>${esc(o.title)}</h3><p>${esc(o.subtitle)}</p></div></div></div>`).join('')}</div><div class="card"><span class="step">Текст предложения</span><p style="font-size:18px;line-height:1.6;margin:0">${esc(c.offers[c.selected].copy)}</p></div><div class="actions"><button class="primary wide" id="selectOffer">Перейти к материалам ${svg('right')}</button></div><div class="hint">${c.source==='ai'?'Предложения созданы ИИ.':'Предложения созданы по шаблонам.'} Проверьте цены и условия перед публикацией.</div>`}
function creative(){const c=byId();if(!c)return tasks();return `<button class="back" data-go="tasks">‹ Назад</button><div class="step">Шаг 2 из 3</div><h1 class="h1">Готово к запуску</h1><p class="lead">Отредактируйте текст и проверьте рекламную сторис.</p><div class="section grid2"><div><div class="field"><label class="label" for="offerTitle">Заголовок</label><input id="offerTitle" maxlength="130" value="${esc(c.title)}"></div><div class="field"><label class="label" for="offerCopy">Текст публикации</label><textarea id="offerCopy" maxlength="500">${esc(c.copy)}</textarea></div><div class="actions"><button class="secondary wide" id="copyOffer">${svg('copy')} Скопировать текст</button><button class="secondary wide" id="downloadStory">${svg('download')} Скачать сторис</button></div></div><div><span class="label">Предпросмотр сторис</span><div class="preview" id="storyPreview"><div class="topline">${esc(state.business.name)}</div><div class="hero" id="storyTitle">${esc(c.title)}</div><div class="bottomline">Напишите нам, чтобы узнать подробности и записаться</div></div></div></div><div class="section"><div class="notice">Выполнить публикацию сможет владелец салона. Автоматическая реклама и рассылки не запускаются.</div><div class="actions"><button class="primary wide" id="approveOffer">${c.status==='approved'||c.status==='published'?'Утверждено — открыть кампанию':'Утвердить предложение'} ${svg('right')}</button></div></div>`}
function launch(){const c=byId();if(!c)return tasks();const approved=c.status==='approved'||c.status==='published';return `<button class="back" data-go="tasks">‹ Назад к задачам</button><div class="step">Шаг 3 из 3</div><h1 class="h1">${c.status==='published'?'Кампания запущена':'Почти готово'}</h1><p class="lead">${approved?'Теперь можно размещать материалы и отмечать реальные продажи.':'Сначала утвердите предложение.'}</p><div class="section card"><span class="status ${approved?'good':''}">${c.status==='published'?'Размещено':approved?'Утверждено':'Требует утверждения'}</span><h2 style="font-size:25px;letter-spacing:-.03em;line-height:1.2;margin:16px 0">${esc(c.title)}</h2><p style="color:#6b7078;margin:0">${esc(c.copy)}</p><hr class="line"><p class="small">Размещайте предложение только в разрешённых каналах бизнеса. После публикации отметьте это здесь.</p>${c.status==='approved'?`<button id="markPublished" class="primary wide">Отметить публикацию</button>`:''}${c.status!=='published'?`<button class="secondary wide" style="margin-top:10px" data-go="creative" data-id="${esc(c.id)}">Изменить материалы</button>`:''}</div>${c.status==='published'?`<div class="section"><h3>Учёт реальных продаж</h3><div class="card"><label class="label" for="paidAmount">Полученная оплата, ₽</label><input id="paidAmount" type="number" min="1" max="100000000" inputmode="numeric" placeholder="Например, 4500"><div class="space"></div><button class="primary wide" id="addPayment">${svg('plus')} Добавить оплату</button></div><div class="hint">Добавляйте только реальные оплаты, подтверждённые салоном. По умолчанию связь с кампанией не доказывает причинный эффект.</div></div>`:''}`}
function results(){let total=state.payments.reduce((a,b)=>a+Number(b.amount||0),0),published=state.campaigns.filter(c=>c.status==='published').length;return `<h1 class="h1">Результат<br>в цифрах</h1><p class="lead">Только подтверждённые вручную данные, без прогнозов и выдуманной аналитики.</p><div class="section grid2"><div class="stat"><div class="kpi">${state.payments.length}</div><div class="kpi-label">Оплаченных визитов</div></div><div class="stat"><div class="kpi">${fmt(total)}</div><div class="kpi-label">Учтённая выручка</div></div></div><div class="section"><h3>Кампании</h3><div class="metricrow"><span>Отмечены как размещённые</span><strong>${published}</strong></div><div class="metricrow"><span>Всего создано</span><strong>${state.campaigns.length}</strong></div></div><div class="section"><h3>Последние оплаты</h3>${state.payments.length?state.payments.slice(0,8).map(p=>`<div class="metricrow"><span>${esc(p.title)}<div class="small">${new Date(p.date).toLocaleDateString('ru-RU')}</div></span><strong>${fmt(p.amount)}</strong></div>`).join(''):`<div class="empty">Пока нет зарегистрированных оплат.</div>`}</div><div class="section notice">Учтённая выручка — это сумма внесённых вами платежей. Это не автоматически доказанная дополнительная прибыль.</div>`}
function business(){const b=state.business;return `<h1 class="h1">Мой бизнес</h1><p class="lead">Данные, на основе которых готовятся предложения.</p><form id="bizForm" class="section card"><div class="field"><label class="label" for="bizName">Название салона</label><input id="bizName" maxlength="90" required value="${esc(b.name)}"></div><div class="field"><label class="label" for="bizService">Основная услуга</label><input id="bizService" maxlength="100" required value="${esc(b.service)}"></div><div class="field"><label class="label" for="bizPrice">Средняя стоимость услуги, ₽</label><input id="bizPrice" type="number" min="1" max="100000000" required value="${Number(b.price)}"></div><div class="field"><label class="label" for="bizChannels">Каналы связи</label><input id="bizChannels" maxlength="130" value="${esc(b.channel)}"></div><div class="field"><label class="label" for="bizBudget">Рекламный бюджет, ₽</label><input id="bizBudget" type="number" min="0" max="100000000" value="${Number(b.budget)||0}"></div><button class="primary wide" type="submit">Сохранить изменения</button></form><div class="section card"><h3 style="font-size:23px;margin:0 0 8px">Подключение ИИ</h3><p class="help">Нужен собственный HTTPS-сервер с Cloud.ru. API-ключ Cloud.ru сюда не вводите.</p><div class="field"><label class="label" for="aiEndpoint">HTTPS-адрес сервера</label><input id="aiEndpoint" type="url" placeholder="https://api.example.ru/" autocomplete="off" value="${esc(aiEndpoint)}"></div><div class="field"><label class="label" for="aiToken">Код доступа</label><input id="aiToken" type="password" placeholder="Код демосервера" autocomplete="off" value="${esc(aiToken)}"></div><button type="button" id="connectAI" class="secondary wide">Проверить подключение</button><div class="hint" id="aiConnectStatus">${aiVerified?'ИИ подключён':'Сервер пока не проверен'}</div></div><div class="section"><p class="help">Приложение работает в демонстрационном режиме. Не вводите персональные данные клиентов.</p><button type="button" class="ghost danger" id="resetDemo">Очистить демонстрационные данные</button></div>`}
function render(){nav();$('salonName').textContent=state.business.name;const views={home,tasks,offer,creative,launch,result:results,business};$('view').innerHTML=(views[page]||home)();wire();}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.go,b.dataset.id)));document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const c=state.campaigns.find(x=>x.id===b.dataset.open);route(c.status==='draft'?'offer':c.status==='chosen'?'creative':'launch',c.id)}));document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>addShort(b.dataset.example));if(page==='home'){$('createButton').onclick=addTask;$('voiceButton').onclick=startVoice;}if(page==='offer'){document.querySelectorAll('[data-select]').forEach(o=>{const choose=()=>{const c=byId();c.selected=Number(o.dataset.select);c.title=c.offers[c.selected].title;c.copy=c.offers[c.selected].copy;save();render()};o.onclick=choose;o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});$('selectOffer').onclick=()=>{let c=byId();if(c.status==='draft')c.status='chosen';save();route('creative',c.id)}}if(page==='creative'){const c=byId(),title=$('offerTitle'),copy=$('offerCopy');const sync=()=>{c.title=title.value;c.copy=copy.value;save();$('storyTitle').textContent=c.title};title.oninput=sync;copy.oninput=sync;$('copyOffer').onclick=()=>copyText(`${title.value}\n\n${copy.value}`);$('downloadStory').onclick=()=>storyPNG(c);$('approveOffer').onclick=()=>{if(!c.title.trim()||!c.copy.trim()){toast('Добавьте заголовок и текст');return}c.status='approved';c.approvedAt=now();save();route('launch',c.id)}}if(page==='launch'){const c=byId();if($('markPublished'))$('markPublished').onclick=()=>{c.status='published';c.publishedAt=now();save();render()};if($('addPayment'))$('addPayment').onclick=()=>{const n=Number($('paidAmount').value);if(!Number.isFinite(n)||n<=0||n>100000000){toast('Укажите корректную сумму оплаты');return}state.payments.unshift({id:'p'+Date.now(),campaignId:c.id,title:c.title,amount:Math.round(n*100)/100,date:now()});save();toast('Оплата добавлена');route('result')}}if(page==='business'){$('bizForm').onsubmit=e=>{e.preventDefault();const b=state.business;b.name=$('bizName').value.trim()||'Мой бизнес';b.service=$('bizService').value.trim()||'Услуги';b.price=Number($('bizPrice').value)||0;b.channel=$('bizChannels').value.trim();b.budget=Number($('bizBudget').value)||0;save();toast('Изменения сохранены');render()};$('connectAI').onclick=async()=>{
 const raw=$('aiEndpoint').value.trim().replace(/\/+$/,''),token=$('aiToken').value.trim();
 if(raw){
  let u;try{u=new URL(raw)}catch(e){toast('Неверный адрес сервера');return}
  if(u.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(u.hostname)){toast('Для сервера нужен HTTPS');return}
  if(u.username||u.password||u.search||u.hash){toast('Введите только базовый адрес сервера');return}
 }
 aiEndpoint=raw;aiToken=token;aiVerified=false;
 localStorage.setItem('rg-ai-endpoint',aiEndpoint);sessionStorage.setItem('rg-ai-session-token',aiToken);
 if(!raw){$('aiConnectStatus').textContent='Демо-режим';return}
 await verifyAI();
};$('resetDemo').onclick=()=>{if(confirm('Удалить все задачи и оплаты на этом устройстве?')){state=JSON.parse(JSON.stringify(seed));save();route('home')}}}}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Текст скопирован')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Текст скопирован')}catch(e){toast('Не удалось скопировать автоматически')}el.remove()}
function startVoice(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('В этом браузере голос недоступен. Напишите задачу текстом.');return}if(voice){try{voice.stop()}catch(e){}voice=null;return}const rec=new Speech();voice=rec;rec.lang='ru-RU';rec.interimResults=false;rec.maxAlternatives=1;const btn=$('voiceButton');btn.classList.add('recording');$('voiceStatus').textContent='Слушаю… скажите вашу задачу.';rec.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';$('taskText').value=($('taskText').value+' '+text).trim();$('voiceStatus').textContent='Проверьте текст и нажмите «Подготовить предложение».'};rec.onerror=()=>{toast('Не получилось распознать речь. Попробуйте написать.');};rec.onend=()=>{voice=null;btn.classList.remove('recording');if($('voiceStatus')?.textContent.includes('Слушаю'))$('voiceStatus').textContent='Можно написать или нажать на микрофон.'};try{rec.start()}catch(e){voice=null;btn.classList.remove('recording');toast('Микрофон недоступен. Введите текст.')}}
function storyPNG(c){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const cx=canvas.getContext('2d');const g=cx.createLinearGradient(0,0,1000,1920);g.addColorStop(0,'#edf2ff');g.addColorStop(.55,'#c8d4ff');g.addColorStop(1,'#9caff2');cx.fillStyle=g;cx.fillRect(0,0,1080,1920);cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=150;cx.beginPath();cx.arc(1110,900,430,0,Math.PI*2);cx.stroke();cx.fillStyle='#1d2951';cx.font='700 44px Arial,sans-serif';cx.fillText(state.business.name.slice(0,35),95,155);cx.font='bold 112px Arial,sans-serif';wrapCanvas(cx,c.title,95,610,880,125,7);cx.font='600 42px Arial,sans-serif';wrapCanvas(cx,'Напишите нам, чтобы узнать подробности и записаться',95,1640,850,60,4);canvas.toBlob(blob=>{if(!blob){toast('Не удалось создать изображение');return}const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='Revenue-Guard-story.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Сторис готова к скачиванию')},'image/png')}
function wrapCanvas(ctx,text,x,y,maxW,lineH,maxLines){let words=String(text).split(/\s+/),line='',lines=[];for(let word of words){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);let n=0;for(let s of lines){if(n>=maxLines)break;if(ctx.measureText(s).width>maxW){while(ctx.measureText(s).width>maxW&&s.length>1)s=s.slice(0,-1);s+='…'}ctx.fillText(s,x,y+n*lineH);n++}}
render();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}))}</script>
