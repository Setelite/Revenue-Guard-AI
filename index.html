.loss-add label{font-size:13px}
.loss-add input,.loss-add select{border-radius:15px;font-size:16px;background:#fff}
.loss-add .primary{margin-top:5px;min-height:61px;border-radius:18px}
.loss-list{margin-top:31px}
.loss-lead{border:1px solid #f1e5ed;background:#fff;padding:20px;border-radius:23px;box-shadow:0 8px 35px #b889a20b;margin-bottom:11px}
.loss-lead.is-urgent{background:linear-gradient(135deg,#fff9f7,#fff);border-color:#f4b9c3;box-shadow:inset 4px 0 0 #ed7483}
.loss-lead-top,.loss-lead-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.loss-source{font-size:15px;font-weight:730}
.loss-status{font-size:11px;line-height:1.4;font-weight:770;border-radius:25px;padding:6px 9px;color:#748274;background:#edf4ef}
.loss-status.urgent{background:#ffe6e6;color:#c75063}
.loss-lead-line{margin:15px 0 8px}
.loss-lead-line strong{font-size:24px;letter-spacing:-.045em}
.loss-lead-line>span{font-size:12px;color:#b19da9;text-align:right}
.loss-lead-sub{font-size:12px;color:#a28f9b;line-height:1.45}
.loss-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:19px}
.loss-buttons button{font-size:12px;font-weight:730;border:1px solid #eadde7;border-radius:13px;background:#fffafd;padding:12px 5px;color:#6d5e69;min-height:45px}
.loss-buttons button:first-child{background:#e9f2ed;border-color:#d4e5db;color:#446f55}
.loss-buttons button:nth-child(2){background:#f8e6f0;border-color:#f0d9e7;color:#ae4179}
.loss-buttons button:hover{filter:brightness(.98)}
.loss-closed{margin-top:13px;font-size:12px;color:#819086}
.loss-empty{background:#fff;border:1px dashed #e8d4df;border-radius:24px;min-height:165px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:25px;color:#9b8994}
.loss-empty svg{width:29px;height:29px;color:#80b18c}
.loss-empty strong{font-size:19px;color:#504451}
.loss-empty span{max-width:310px;font-size:13px}
.loss-disclaimer,.loss-legacy{font-size:12px;line-height:1.65;color:#998b97;margin:24px 5px}
.loss-legacy{background:#faf1f7;padding:13px 15px;border-radius:15px;margin:10px 0}
.risk-home-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(100deg,#ffe8ed,#fff0f5);color:#a14a6a;border:1px solid #f9d3dc;border-radius:18px;padding:13px 17px;margin:14px 0 22px;font-size:14px;font-weight:700;text-align:left;width:100%}
.risk-home-banner svg{width:20px;height:20px}
@media(max-width:720px){
 .bottom{gap:0;padding:7px 5px calc(6px + env(safe-area-inset-bottom));}
 .bottom button{flex:1;min-width:0!important;padding:8px 1px;min-height:57px;font-size:10px;letter-spacing:-.02em;gap:4px;}
 .bottom button svg{width:20px;height:20px}
 .losses-title{font-size:47px}
 .loss-stat{padding:19px 18px;border-radius:21px}
 .loss-stat strong{font-size:49px}
 .potential-box{padding:21px 18px;flex-direction:column;align-items:flex-start;gap:5px}
 .potential-note{max-width:none}
 .loss-add{padding:18px;border-radius:22px}
 .loss-field-row{grid-template-columns:1fr 1fr;gap:9px}
 .loss-field-row input,.loss-field-row select{padding:15px 9px;font-size:14px}
 .loss-section-head h2{font-size:22px}
 .loss-lead{padding:17px}
}
@media(max-width:360px){.bottom button{font-size:9px}.loss-buttons button{font-size:11px;padding:10px 2px}.loss-stat strong{font-size:43px}}
</style><style>.loss-reopen{background:transparent;border:0;color:#b7518b;font-size:12px;font-weight:780;margin-left:8px;padding:7px}.loss-reopen:hover{text-decoration:underline}</style></head>
<body>
<div class="layout">
  <aside class="side">
    <a href="#" class="brand" onclick="window.route('home');return false"><span class="logo">RG</span>Revenue Guard</a>
    <nav class="nav" id="sidenav"></nav>
    <div class="sidefoot">Демонстрация продукта<br>Данные хранятся только<br>на этом устройстве.</div>
  </aside>
  <main class="main">
    <header class="top"><a href="#" class="brand" onclick="window.route('home');return false"><span class="logo">↗</span><span>Revenue Guard</span></a><div class="top-actions"><span class="owner" id="salonName">Студия красоты</span><button type="button" id="settingsOpen" class="settings-button" aria-label="Настройки бизнеса" title="Настройки бизнеса"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 12h2m14 0h2M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8L17 7m-10 10-1.4 1.4"/></svg></button></div></header>
    <div id="view"></div>
  </main>
</div>
<nav id="bottomnav" class="bottom" aria-label="Разделы приложения"></nav>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const icon={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 10h18"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 19v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',tag:'<path d="m11 3 10 10-8 8L3 11V3h8z"/><circle cx="7.5" cy="7.5" r="1"/>',camera:'<rect x="2" y="5" width="20" height="16" rx="4"/><circle cx="12" cy="13" r="4"/><path d="M7 5l1.5-2h7L17 5"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h6"/>',result:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',business:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/>',right:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m4 20 4-.8L19 8a2 2 0 0 0-3-3L5 16z"/>',alert:'<path d="M12 3 2 21h20L12 3zM12 9v5m0 4h.01"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true">${icon[name]||icon.spark}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
const seed={business:{name:'Мой бизнес',industry:'other',service:'Товар или услуга',price:0,channel:'Собственные соцсети',budget:0,audience:'',advantage:''},campaigns:[],payments:[],leads:[]};
const industries={beauty:['Красота и здоровье'],retail:['Магазин и товары'],food:['Кафе и еда'],services:['Услуги'],education:['Обучение'],b2b:['B2B и опт'],other:['Другое']};
const industryOptions=()=>Object.entries(industries).map(([id,v])=>`<option value="${id}" ${state.business.industry===id?'selected':''}>${v[0]}</option>`).join('');
let state;
try{let v=JSON.parse(localStorage.getItem('rg-clean-v2'));state=v?.business&&Array.isArray(v.campaigns)&&Array.isArray(v.payments)?v:JSON.parse(JSON.stringify(seed))}catch(e){state=JSON.parse(JSON.stringify(seed))}
if(!state.business.industry)state.business.industry=state.business.name==='Студия красоты'?'beauty':'other';
state.business.audience=state.business.audience||'';
state.business.advantage=state.business.advantage||'';
if(!Array.isArray(state.leads))state.leads=[];
if(![4,12,24,48].includes(Number(state.leadSlaHours)))state.leadSlaHours=24;

let page='home',active=null,voice=null,aiBusy=false,aiVerified=false,composerOpen=false,composerDraft='';
let aiEndpoint=localStorage.getItem('rg-ai-endpoint')||'';
let aiToken=sessionStorage.getItem('rg-ai-session-token')||'';
async function aiRequest(path,options={}){
 if(!aiEndpoint||!aiToken)throw Error('Укажите сервер и код доступа в разделе «Бизнес».');
 const url=new URL(path,aiEndpoint.replace(/\/+$/,'')+'/');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),28000);
 try{
  const response=await fetch(url.toString(),{...options,headers:{'X-Demo-Token':aiToken,...(options.headers||{})},signal:controller.signal});
  if(!response.ok){
   let detail='Ошибка сервера '+response.status;
   try{const data=await response.json();if(typeof data.detail==='string')detail=data.detail}catch(e){}
   throw Error(detail);
  }
  return await response.json();
 }finally{clearTimeout(timeout)}
}
async function verifyAI(){
 aiVerified=false;
 const label=$('aiConnectStatus');
 if(label)label.textContent='Проверяю соединение…';
 try{
  const result=await aiRequest('api/status');
  aiVerified=Boolean(result.ai_enabled);
  if(label)label.textContent=aiVerified?'Ключ найден на сервере. Проверьте генерацию задачей.':'Сервер отвечает, но ключ ИИ ещё не настроен';
  if(aiVerified)toast('Сервер настроен; проверьте генерацию');
 }catch(e){if(label)label.textContent=e.message;else toast(e.message)}
}

const now=()=>new Date().toISOString();
function save(){try{localStorage.setItem('rg-clean-v2',JSON.stringify(state))}catch(e){toast('Нет доступа к сохранению. Данные могут исчезнуть.')}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3300)}
const tabs=[['home','Главная','home'],['tasks','Идеи','spark'],['studio','Студия','camera'],['losses','Клиенты','users'],['result','Итоги','result']];
function nav(){const tab=page==='creative'||page==='launch'?'studio':page==='offer'?'tasks':page;const item=([id,label,ic])=>`<button type="button" data-route="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}">${svg(ic)}<span>${label}</span></button>`;$('sidenav').innerHTML=tabs.map(item).join('')+`<button type="button" data-route="business" class="${page==='business'?'active':''}">${svg('business')}<span>Настройки</span></button>`;$('bottomnav').innerHTML=tabs.map(item).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));}
function route(p,id){page=p;if(id!==undefined)active=id;nav();render();window.scrollTo({top:0,behavior:'instant'});}
window.route=route;
function byId(){return state.campaigns.find(x=>x.id===active)}

async function addTask(){
 const el=$('taskText'),text=el?.value.trim();
 if(!text){toast('Опишите задачу одной фразой');el?.focus();return}
 if(aiBusy)return;
 aiBusy=true;const btn=$('createButton');if(btn){btn.disabled=true;btn.textContent='Готовлю предложения…'}
 try{
  let offers,source='demo';
  if(aiEndpoint){
   const b=state.business;
   const data={goal:text,business:{name:b.name,city:b.city||'Екатеринбург',industry:industries[b.industry]?.[0]||'Другое',audience:b.audience||'',advantage:b.advantage||'',voice:'Спокойно и понятно',channels:b.channel||'Собственные каналы',budget:Number(b.budget)||0,services:[{name:b.service,price:Number(b.price)||0,duration:0}]}};
   const output=await aiRequest('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
   if(!Array.isArray(output.offers)||output.offers.length!==3)throw Error('ИИ вернул неверный формат');
   offers=output.offers.map(o=>({title:o.title,headline:o.headline,subtitle:o.reason||o.description||'',copy:o.copy||'',channel:o.channel,steps:o.steps,caution:o.caution}));
   source='ai';
  }else offers=buildOffers(text);
  const id='rg'+Date.now()+Math.random().toString(36).slice(2,6);
  const c={id,task:text,offers,selected:0,status:'draft',title:offers[0].headline||offers[0].title,copy:offers[0].copy,source,businessSnapshot:{...state.business},created:now(),approvedAt:null,publishedAt:null};
  state.campaigns.unshift(c);save();route('offer',id);
 }catch(e){toast('Ошибка ИИ: '+(e.name==='AbortError'?'Превышено время ожидания':e.message))}
 finally{aiBusy=false;if(btn&&document.contains(btn)){btn.disabled=false;btn.innerHTML='Получить 3 идеи '+svg('right')}}
}
window.addTask=addTask;
function buildOffers(task){
 const b=state.business,item=(b.service||'товар или услугу').trim(),brand=(b.name||'наш бизнес').trim();
 const channel=b.channel||'Собственные каналы';
 const audience=(b.audience||'').trim(),advantage=(b.advantage||'').trim();
 return [
 {title:'Прямое предложение',headline:'Есть идея для вас',subtitle:'Продажи · понятный следующий шаг',channel,steps:['Проверить наличие и цену','Утвердить текст','Опубликовать в своём канале'],caution:'Перед публикацией проверьте цены, наличие и условия.',copy:`В «${brand}» можно узнать подробнее про ${item.toLowerCase()}.${advantage?' '+advantage+'.':''} Напишите нам — расскажем о деталях и условиях.`},
 {title:'Диалог с покупателями',headline:'Есть вопрос?',subtitle:'Вовлечение · ответ на вопрос',channel,steps:['Выбрать реальный вопрос','Подготовить точный ответ','Опубликовать'],caution:'Не публикуйте неподтверждённые свойства и обещания.',copy:`Есть вопросы про ${item.toLowerCase()}? Напишите «${brand}» — объясним детали и условия. Ответим без лишних обещаний.`},
 {title:'Показать продукт',headline:'Посмотрите ближе',subtitle:'Доверие · показать реальный процесс',channel,steps:['Снять реальный товар или процесс','Проверить факты и разрешения','Согласовать и опубликовать'],caution:'Не публикуйте чужие фотографии или персональные данные без разрешения.',copy:`Покажем, как выглядит ${item.toLowerCase()} в «${brand}». Хотите подробностей? Напишите нам, уточним характеристики и условия.`}
 ];
}
function addShort(text){$('taskText').value=text;$('taskText').focus();}
window.addShort=addShort;

function ideaArt(i){
 if(state.business.industry!=='beauty')return '<span class="business-art business-art-'+i+'" aria-hidden="true"><span class="art-object"></span><span class="art-decoration"></span><span class="art-symbol">'+['↗','?','✦'][i]+'</span></span>';
 if(i===0)return '<span class="idea-gift" aria-hidden="true"><span class="gift-lid"></span><span class="gift-bow">✧</span><span class="gift-card">♡</span></span>';
 if(i===1)return '<span class="idea-face" aria-hidden="true"><span class="face-hair"></span><span class="face-neck"></span><span class="face-skin"></span><span class="face-eye"></span><span class="face-lip"></span><span class="face-brush"></span></span>';
 return '<span class="idea-vanity" aria-hidden="true"><span class="vanity-glow"></span><span class="vanity-lamp"></span><span class="vanity-bottle"></span><span class="vanity-brush"></span></span>';
}
function ideaPreviewCards(){
 const current=state.campaigns[0];
 const offers=current?.offers?.length===3?current.offers:[
  {title:'Готовый оффер',subtitle:'Простая идея для продаж'},
  {title:'Вопрос аудитории',subtitle:'Начните диалог'},
  {title:'Обзор продукта',subtitle:'Покажите товар или процесс'}
 ];
 const formats=['Оффер','Вопрос','Обзор'];
 return offers.slice(0,3).map((o,i)=>`<button type="button" class="inspo-card inspo-${i}" data-preview="${i}" aria-label="${esc(o.title)} — ${current?'открыть предложение':'начать задачу'}"><span class="inspo-art">${ideaArt(i)}</span><span class="inspo-shade"></span><span class="inspo-top"><span class="inspo-format">${formats[i]}</span><span class="inspo-index">0${i+1}</span></span><span class="inspo-copy"><strong>${esc(o.title)}</strong><small>${esc(o.subtitle||'Перейти к идее')}</small></span><span class="inspo-arrow">↗</span></button>`).join('');
}
function showComposer(text=''){
 composerOpen=true;composerDraft=text;page='home';render();
 const input=$('taskText');
 if(input){input.value=text;if(input.scrollIntoView)input.scrollIntoView({behavior:'smooth',block:'center'});input.focus({preventScroll:true})}
}
function home(){
 const recent=state.campaigns[0];
 const heading=recent?.source==='ai'?'3 идеи от ИИ':recent?'Ваши 3 идеи':'Идеи для бизнеса';
 return `<div class="social-home">
  <div class="social-greeting">Ваш помощник по росту <span aria-hidden="true">✳</span></div><button type="button" class="industry-pill" data-go="business">${state.business.name==='Мой бизнес'?'Настроить мой бизнес':'Сфера: '+esc(industries[state.business.industry]?.[0]||'Другое')} ↗</button>
  <h1 class="social-title">Что будем<br><span>улучшать сегодня?</span></h1>
  <button class="hero-cta" type="button" data-compose aria-label="Сформировать новую идею">
   <span class="hero-glimmer" aria-hidden="true">✳</span>
   <span class="hero-copy"><span class="hero-label">ВАША КРЕАТИВНАЯ СТУДИЯ</span><strong>Продажи, клиенты<br>и идеи для роста</strong><span class="hero-circle">→</span></span>
   <span class="hero-phone" aria-hidden="true"><span class="hero-photo"><span class="hero-progress"></span><span class="hero-bottle"></span><span class="hero-pump"></span><span class="hero-towel"></span><span class="hero-love">♡</span></span></span>
  </button>
  ${state.leads.filter(isRiskLead).length?`<button type="button" class="risk-home-banner" data-go="losses">${svg('alert')}<span>${state.leads.filter(isRiskLead).length} обращений требуют проверки</span><span>→</span></button>`:''}
  <div class="quick-grid" aria-label="Быстрый старт">
   <button type="button" class="quick-action quick-peach" data-quick="Хочу увеличить продажи основного товара или услуги без скидок. Предложи три разных способа."><span class="quick-icon">${svg('calendar')}</span><span>Увеличить<br>продажи</span></button>
   <button type="button" class="quick-action quick-lilac" data-quick="Хочу получать больше обращений через наши каналы. Предложи три разные механики."><span class="quick-icon">${svg('spark')}</span><span>Привлечь<br>клиентов</span></button>
   <button type="button" class="quick-action quick-rose" data-quick="Хочу увеличить повторные покупки без массовых сообщений и скидок."><span class="quick-icon">${svg('users')}</span><span>Повторные<br>продажи</span></button>
   <button type="button" class="quick-action quick-cream" data-quick="Предложи три идеи контента для моего товара или услуги: сторис, пост и короткое видео."><span class="quick-icon">${svg('tag')}</span><span>Создать<br>контент</span></button>
  </div>
  <section class="inspo-section" aria-label="Вдохновение">
   <div class="inspo-head"><h2>${heading} <span aria-hidden="true">✦</span></h2><button class="inspo-all" type="button" data-go="tasks">${recent?'Все идеи':'Мои идеи'} →</button></div>
   <div class="inspo-scroll">${ideaPreviewCards()}</div>
   <div class="inspo-status">${recent?(recent.source==='ai'?'Предложения созданы ИИ. Проверьте условия перед публикацией.':'Предложения созданы локально по шаблонам.'):'Это примеры визуального оформления, не генерация ИИ. Создайте задачу для своего бизнеса.'}</div>
  </section>
  <button id="createIdea" type="button" class="social-main-cta"><span aria-hidden="true">✧</span> Создать идею <span class="cta-arrow">→</span></button>
  ${composerOpen?`<section id="composer" class="composer-panel"><div class="composer-head"><h2>Расскажите о задаче</h2><button type="button" class="composer-close" id="closeComposer" aria-label="Закрыть поле задачи">×</button></div><p>Один запрос — три варианта действий.</p><div class="voice-input"><textarea id="taskText" aria-label="Коммерческая задача" maxlength="600" placeholder="Например: хочу продать больше товаров без скидок.">${esc(composerDraft)}</textarea><button id="voiceButton" class="round" type="button" title="Продиктовать задачу" aria-label="Продиктовать задачу">${svg('mic')}</button></div><button type="button" class="primary wide" id="createButton">Получить 3 идеи ${svg('right')}</button><div class="hint" id="voiceStatus">Можно написать или продиктовать задачу.</div></section>`:''}
  ${state.campaigns.length?`<div class="social-recent"><h3>Продолжить работу</h3>${campaignRow(state.campaigns[0])}</div>`:''}

const leadSources={instagram:'Instagram',telegram:'Telegram',site:'Сайт',phone:'Звонок',walkin:'Лично',other:'Другое'};
const leadStatuses={new:'Не обработано',working:'В работе',won:'Закрыто успешно',lost:'Закрыто без покупки'};
const isTrackedLead=l=>l?.tracked===true&&leadStatuses[l.status]&&Number.isFinite(Date.parse(l.createdAt));
const isOpenLead=l=>l.status==='new'||l.status==='working';
const leadHours=l=>Math.max(0,(Date.now()-Date.parse(l.lastTouchAt||l.createdAt))/3600000);
const isRiskLead=l=>isTrackedLead(l)&&isOpenLead(l)&&leadHours(l)>=state.leadSlaHours;
const leadAge=h=>h<1?'меньше часа':h<24?Math.floor(h)+' ч.':Math.floor(h/24)+' дн.';
const safeMoney=n=>Number.isFinite(Number(n))&&Number(n)>0&&Number(n)<=100000000?Number(n):0;
const localDateTime=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
function losses(){
 const tracked=state.leads.filter(isTrackedLead),legacyCount=state.leads.length-tracked.length;
 const attention=tracked.filter(isRiskLead),open=tracked.filter(isOpenLead);
 const potential=attention.reduce((sum,l)=>sum+safeMoney(l.estimate),0);
 const unknown=attention.filter(l=>!safeMoney(l.estimate)).length;
 const ordered=[...tracked].sort((a,b)=>Number(isRiskLead(b))-Number(isRiskLead(a))||Number(isOpenLead(b))-Number(isOpenLead(a))||Date.parse(b.createdAt)-Date.parse(a.createdAt));
 return `<section class="losses-page">
 <div class="losses-eyebrow">${svg('alert')} КОНТРОЛЬ ОБРАЩЕНИЙ</div>
 <h1 class="losses-title">Где теряются<br><em>деньги?</em></h1>

  <div class="loss-stat loss-hot"><span>Нужно проверить</span><strong id="riskCount">${attention.length}</strong><small>Без действий ≥ ${state.leadSlaHours} ч.</small></div>
  <div class="loss-stat"><span>Открытых</span><strong id="openCount">${open.length}</strong><small>Вручную внесённые</small></div>
 </div>
 <div class="potential-box"><div><span>Под риском · условная сумма</span><strong id="riskValue">${fmt(potential)}</strong></div><div class="potential-note">Сумма оценок по ${attention.length} необработанным вовремя обращениям${unknown?' · '+unknown+' без оценки':''}. Это не доказанные потери или ожидаемая выручка.</div></div>
 <div class="risk-settings"><label for="riskHours">Проверять, если не было действий</label><select id="riskHours"><option value="4" ${state.leadSlaHours===4?'selected':''}>4 часа</option><option value="12" ${state.leadSlaHours===12?'selected':''}>12 часов</option><option value="24" ${state.leadSlaHours===24?'selected':''}>24 часа</option><option value="48" ${state.leadSlaHours===48?'selected':''}>48 часов</option></select></div>
 <section class="loss-add"><div class="loss-section-head"><h2>Новое обращение</h2><span>Без ФИО и телефонов</span></div><form id="leadForm">
 <div class="loss-field-row"><div class="field"><label class="label" for="newLeadSource">Откуда пришло</label><select id="newLeadSource">${Object.entries(leadSources).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label class="label" for="newLeadEstimate">Возможный чек, ₽</label><input id="newLeadEstimate" type="number" inputmode="decimal" step="1" min="0" max="100000000" placeholder="Неизвестно" value="${safeMoney(state.business.price)||''}"></div></div>
 <div class="field"><label class="label" for="newLeadDate">Когда пришло обращение</label><input id="newLeadDate" type="datetime-local" required value="${localDateTime()}" max="${localDateTime()}"></div>
 <button type="submit" class="primary wide">${svg('plus')} Добавить обращение</button></form></section>
 <section class="loss-list"><div class="loss-section-head"><h2>Ваши обращения</h2><span>${tracked.length} учтено</span></div>
 ${ordered.length?ordered.map(l=>{const urgent=isRiskLead(l),hrs=leadHours(l),closed=!isOpenLead(l);
 return `<article class="loss-lead ${urgent?'is-urgent':''}" data-lead-id="${esc(l.id)}">
  <div class="loss-lead-top"><span class="loss-source">${esc(leadSources[l.source]||'Другое')}</span><span class="loss-status ${urgent?'urgent':''}">${urgent?'Требует внимания':leadStatuses[l.status]}</span></div>
  <div class="loss-lead-line"><strong>${safeMoney(l.estimate)?fmt(l.estimate):'Чек не указан'}</strong><span>${closed?'Завершено':esc(leadAge(hrs))+' без действий'}</span></div>
  <div class="loss-lead-sub">${esc(new Date(l.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))} · ${urgent?'Нет отметки о действии дольше заданного срока':closed?'Обращение закрыто':'Ожидает следующего действия'}</div>
  ${!closed?`<div class="loss-buttons"><button type="button" data-lead-action="working" data-id="${esc(l.id)}">Ответили</button><button type="button" data-lead-action="won" data-id="${esc(l.id)}">Продано</button><button type="button" data-lead-action="lost" data-id="${esc(l.id)}">Без покупки</button></div>`:`<div class="loss-closed">${l.status==='won'?'Закрыто как продажа (без автоматического учёта денег)':'Закрыто без покупки'} <button type="button" class="loss-reopen" data-lead-action="working" data-id="${esc(l.id)}">Вернуть в работу</button></div>`}
 </article>`}).join(''):`<div class="loss-empty">${svg('check')}<strong>Пока нет обращений</strong><span>Добавьте первое — и приложение поможет не забыть его обработать.</span></div>`}
 ${legacyCount?`<p class="loss-legacy">Ещё ${legacyCount} старых записей учитываются в прежней статистике. Для них неизвестен статус обработки, поэтому мы не считаем их просроченными.</p>`:''}
 </section>
 <div class="loss-disclaimer">Это локальный журнал, а не подключение к Instagram, мессенджерам или CRM. Приоритет определяется временем последнего отмеченного действия и выбранным сроком. Данные не проверяются автоматически. Для реальных клиентов не вводите персональные данные.</div>
 </section>`;
}

function startVoice(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('В этом браузере голос недоступен. Напишите задачу текстом.');return}if(voice){try{voice.stop()}catch(e){}voice=null;return}const rec=new Speech();voice=rec;rec.lang='ru-RU';rec.interimResults=false;rec.maxAlternatives=1;const btn=$('voiceButton');btn.classList.add('recording');$('voiceStatus').textContent='Слушаю… скажите вашу задачу.';rec.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';$('taskText').value=($('taskText').value+' '+text).trim();$('voiceStatus').textContent='Проверьте текст и нажмите «Подготовить предложение».'};rec.onerror=()=>{toast('Не получилось распознать речь. Попробуйте написать.');};rec.onend=()=>{voice=null;btn.classList.remove('recording');if($('voiceStatus')?.textContent.includes('Слушаю'))$('voiceStatus').textContent='Можно написать или нажать на микрофон.'};try{rec.start()}catch(e){voice=null;btn.classList.remove('recording');toast('Микрофон недоступен. Введите текст.')}}
function storyPNG(c){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;
 const cx=canvas.getContext('2d');const theme=c.posterTheme||'pearl';
 const palette={pearl:['#dcebf0','#789fa8','#233b44','#f3f5eb'],ink:['#15231f','#506f60','#f7e8c9','#b99c6a'],sunset:['#ffeadc','#da8d7f','#59372f','#f9d79c']}[theme]||['#dcebf0','#789fa8','#233b44','#f3f5eb'];
 const bg=cx.createLinearGradient(0,0,650,1920);bg.addColorStop(0,palette[0]);bg.addColorStop(1,palette[1]);cx.fillStyle=bg;cx.fillRect(0,0,1080,1920);
 const ball=cx.createRadialGradient(780,600,18,860,930,515);ball.addColorStop(0,palette[3]);ball.addColorStop(.55,palette[1]);ball.addColorStop(1,palette[0]);cx.shadowColor='#122b3340';cx.shadowBlur=75;cx.fillStyle=ball;cx.beginPath();cx.arc(915,930,475,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
 cx.fillStyle=palette[2];cx.font='bold 40px Arial,sans-serif';cx.fillText((c.businessSnapshot?.name||state.business.name).slice(0,37),85,160);
 cx.strokeStyle=palette[2];cx.globalAlpha=.35;cx.lineWidth=2;cx.beginPath();cx.moveTo(85,1550);cx.lineTo(995,1550);cx.stroke();cx.globalAlpha=1;
 let size=104;cx.font='bold '+size+'px Arial,sans-serif';const title=String(c.title||'Ваше предложение');if(title.length>70)size=82;cx.font='bold '+size+'px Arial,sans-serif';
 wrapCanvas(cx,title,85,585,905,size*1.18,7);
 cx.font='600 40px Arial,sans-serif';wrapCanvas(cx,'Уточните детали и запись в сообщениях',85,1675,900,59,3);
 cx.font='600 28px Arial,sans-serif';cx.globalAlpha=.65;cx.fillText('REVENUE GUARD · CREATIVE STUDIO',85,1845);cx.globalAlpha=1;
 canvas.toBlob(blob=>{if(!blob){toast('Не удалось создать постер');return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Revenue-Guard-'+theme+'-story.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Сторис 1080 × 1920 готова')},'image/png')
}
function wrapCanvas(ctx,text,x,y,maxW,lineH,maxLines){let words=String(text).split(/\s+/),line='',lines=[];for(let word of words){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);let n=0;for(let s of lines){if(n>=maxLines)break;if(ctx.measureText(s).width>maxW){while(ctx.measureText(s).width>maxW&&s.length>1)s=s.slice(0,-1);s+='…'}ctx.fillText(s,x,y+n*lineH);n++}}
render();
})();
