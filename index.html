<script>
(()=>{'use strict';
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 11h6M9 15h6"/>',creative:'<path d="M12 3 9.5 9.5 3 12l6.5 2.5L12 21l2.5-6.5L21 12l-6.5-2.5z"/>',results:'<path d="M4 20V10m6 10V4m6 16v-7m5 7H3"/>',profile:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0m-7 7v5m-4 0h8"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',check:'<path d="M5 12 10 17 20 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/>',image:'<rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m2 16 6-5 4 4 3-3 7 6"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10h18M7 3h11"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m8 12 3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',external:'<path d="M12 5H5v14h14v-7M13 3h8v8m0-8-10 10"/>'};
function ic(name,size=19){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.spark)+'</svg>'}
const NAV=[['home','Главная','home'],['tasks','Задачи','tasks'],['creative','Креатив','creative'],['results','Продажи','results'],['profile','Бизнес','profile']];
const STORAGE='revenue-guard-mvp10-state';
const DEFAULT={business:{name:'Студия «Линия»',city:'Екатеринбург · Академический',voice:'Дружелюбный, уверенный, без навязчивых скидок',budget:'0',channels:'Telegram-канал, VK, сторис',services:'Маникюр | 2500 | 90\nОкрашивание волос | 4500 | 180\nУход за волосами | 3000 | 60\nСтрижка | 1800 | 60'},tasks:[],sales:[],version:1};
let state=load(), tab='home', selectedId=null, selectedOffer=0, aiEnabled=false, busy=false, recording=false, speech=null, draftText='';
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&v.version===1&&v.business&&Array.isArray(v.tasks)&&Array.isArray(v.sales))return v}catch(e){}return structuredClone(DEFAULT)}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast('Нет доступа к сохранению в браузере')}}
function e(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' ₽'}
function date(v){return new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3400)}
function serviceList(){return state.business.services.split('\n').map(x=>{const [name,price,duration]=x.split('|').map(z=>(z||'').trim());return{name,price:Number(price)||0,duration:Number(duration)||0}}).filter(x=>x.name).slice(0,30)}
function statusName(x){return {draft:'Черновик',review:'Согласование',approved:'Одобрено',published:'Размещено'}[x]||x}
function short(s,n=65){return String(s||'').length>n?String(s).slice(0,n-1)+'…':s}
function escCsv(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function dlText(name,text,kind='text/plain'){const blob=new Blob([text],{type:kind});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function getTask(){return state.tasks.find(x=>x.id===selectedId)||null}
function navigate(t){tab=t;document.getElementById('content').innerHTML='';render();window.scrollTo({top:0,behavior:'instant'})}
function header(title,sub){return `<div class="eyebrow">REVENUE GUARD AI · ${tab.toUpperCase()}</div><h1 class="welcome">${title}</h1><p class="sub">${sub}</p>`}
function taskItem(t){return `<div class="task" data-open="${e(t.id)}" role="button" tabindex="0"><div><h3>${e(short(t.goal,86))}</h3><p>${date(t.createdAt)} · ${e(t.source==='ai'?'ИИ-предложения':'Демо-предложения')}</p></div><span class="tag ${e(t.status)}">${statusName(t.status)}</span></div>`}

function render(){renderNav();const content=document.getElementById('content');content.innerHTML=tab==='home'?dashboard():tab==='tasks'?tasksView():tab==='creative'?creativeView():tab==='results'?resultsView():profileView();const pill=document.getElementById('modePill');pill.className='pill'+(aiEnabled?' green':'');pill.textContent=aiEnabled?'● ИИ подключен (Yandex AI Studio)':'◌ Демо · локальная генерация';bind()}
function offlineOffers(goal){const lower=goal.toLowerCase(),svc=serviceList(),hints=[[/колорист|окраш|цвет/,/окраш|колорист/],[/уход|восстанав|процедур/,/уход|восстанав/],[/маникюр|ногт/,/маникюр/],[/стриж|парикмахер/,/стриж/]],match=hints.find(([a])=>a.test(lower)),focus=svc.find(s=>lower.includes(s.name.toLowerCase()))||(match&&svc.find(s=>match[1].test(s.name.toLowerCase())))||svc[0]||{name:'услуга',price:0};const price=focus.price?`По прайсу — ${money(focus.price)}.`:'Стоимость уточняется у администратора.';const windows=/свобод|окн|завтра|час/.test(lower),launch=/нов|запуск|появил/.test(lower),newMsg=windows?`У нас появилось свободное время на ${focus.name.toLowerCase()}. ${price} Уточните часы у администратора перед записью.`:launch?`Знакомьтесь: ${focus.name.toLowerCase()}. ${price} Напишите нам, если хотите узнать детали и записаться.`:`Хотите уделить время себе? Запишитесь на ${focus.name.toLowerCase()}. ${price} Уточните свободные окна у администратора.`;const base=`${focus.name} · ${price}`;
return [{title:windows?'Заполнить свободное время без скидок':launch?'Представить услугу постоянной аудитории':'Прямое предложение своей аудитории',reason:'Начинаем с собственных каналов: затраты на размещение могут быть ниже, но охват неизвестен.',channel:'Собственные соцсети',description:base,headline:windows?'Свободное время у мастера':launch?'Новая услуга в салоне':'Время для себя',copy:newMsg+' Для заявки напишите нам в сообщения.',steps:['Уточнить у администратора фактические свободные часы','Проверить стоимость, текст и макет','Разместить в собственном канале после утверждения','Отмечать заявки и подтверждённые оплаты'],caution:'Нельзя обещать время, которое не проверено по ручной записи.'},
{title:'Локальное партнёрское предложение',reason:'Попробовать аудиторию соседних бизнесов без покупки рекламы; партнёрство ещё нужно согласовать.',channel:'Локальный партнёр · ручное согласование',description:base,headline:'Соседям — приятный повод заглянуть',copy:`Для жителей района: ${focus.name.toLowerCase()}. ${price} Подробности и доступное время — у администратора.`,steps:['Определить 2–3 подходящих бизнеса района','Согласовать партнёрство и условия','Подготовить отдельный макет и отслеживаемую ссылку','Проверить заявки и подтверждённые визиты'],caution:'Нельзя размещать материалы на площадке партнёра без его согласия.'},
{title:'Понятное предложение без ценового давления',reason:'Упор на пользу и консультацию, а не непроверенные обещания и скидки.',channel:'VK / Telegram / сторис',description:base,headline:'Забота о себе в удобное время',copy:`${newMsg} Мастер расскажет, подходит ли процедура именно вам.`,steps:['Выбрать услугу и проверить описание','Создать сторис и короткий пост','Утвердить публикацию и опубликовать вручную','Зафиксировать источник каждой новой заявки'],caution:'Не гарантировать эффект процедур и не выдумывать отзывы.'}];}
async function generateOffers(goal){const payload={goal,business:{name:state.business.name,city:state.business.city,voice:state.business.voice,channels:state.business.channels,budget:Number(state.business.budget)||0,services:serviceList()}};if(aiEnabled){try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('Ответ сервера '+r.status);const data=await r.json();if(!Array.isArray(data.offers)||data.offers.length!==3)throw Error('Неожиданный формат ответа');return {offers:data.offers,source:'ai'}}catch(err){toast('ИИ недоступен — использованы демо-шаблоны. '+err.message)}}return {offers:offlineOffers(goal),source:'demo'}}
async function createTask(){const input=document.getElementById('command');const goal=(input?.value||'').trim();if(goal.length<12){toast('Опиши бизнес-задачу чуть подробнее — хотя бы 12 символов');return}if(busy)return;draftText='';const t={id:'t'+Date.now(),goal:goal.slice(0,600),createdAt:Date.now(),status:'draft',offers:[],chosen:0,source:'demo'};state.tasks.unshift(t);selectedId=t.id;tab='tasks';busy=true;render();try{const r=await generateOffers(goal);t.offers=r.offers;t.source=r.source;save();toast(r.source==='ai'?'ИИ подготовил 3 стратегии':'Готово: три демонстрационных варианта')}finally{busy=false;render()}}
function setTaskStatus(t,status){t.status=status;save();render();toast(status==='review'?'На согласовании':status==='approved'?'Утверждено владельцем':status==='published'?'Публикация отмечена вручную':'Сохранено')}
function processStatus(){const t=getTask();if(!t)return;if(t.status==='draft')setTaskStatus(t,'review');else if(t.status==='review'){if(!confirm('Вы проверили предложение, цены, ограничения и разрешаете подготовить его к размещению?'))return;setTaskStatus(t,'approved')}else if(t.status==='approved'){if(!confirm('Материал действительно размещён вручную? Это только отметка, публикация не выполняется приложением.'))return;setTaskStatus(t,'published')}}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Текст скопирован')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Текст скопирован')}catch(e){toast('Не удалось скопировать автоматически')}ta.remove()}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=9){const words=String(text).split(/\s+/),lines=[];let line='';for(const w of words){if(ctx.measureText((line?line+' ':'')+w).width>maxWidth&&line){lines.push(line);line=w}else line+=(line?' ':'')+w}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return Math.min(lines.length,maxLines)*lineHeight}
function posterPNG(){const t=getTask(),c=t?.creative;if(!c){toast('Сначала сохраните креатив');return}const can=document.createElement('canvas');can.width=1080;can.height=1920;const ctx=can.getContext('2d');let bg=ctx.createLinearGradient(0,0,1080,1920);bg.addColorStop(0,'#342449');bg.addColorStop(.6,'#171c31');bg.addColorStop(1,'#18515b');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);let g=ctx.createRadialGradient(900,250,20,900,250,700);g.addColorStop(0,'#9b70cb99');g.addColorStop(1,'#9b70cb00');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1100);ctx.beginPath();ctx.arc(1100,860,520,0,Math.PI*2);ctx.strokeStyle='#ffffff2a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#f6f4ff';ctx.textBaseline='top';ctx.font='bold 34px Arial';wrap(ctx,state.business.name.toUpperCase(),90,115,880,52,2);let headline=c.headline;let size=headline.length>60?65:headline.length>37?78:93;ctx.font=`bold ${size}px Arial`;ctx.fillStyle='#ffffff';let ht=wrap(ctx,headline,90,725,890,size*1.18,8);ctx.font='37px Arial';ctx.fillStyle='#e3e5f0';wrap(ctx,c.subline,90,725+ht+70,870,58,9);ctx.fillStyle='#ffffff1f';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(90,1650,610,108,54);else ctx.rect(90,1650,610,108);ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=2;ctx.stroke();ctx.font='bold 36px Arial';ctx.fillStyle='white';wrap(ctx,c.cta,130,1675,540,46,2);can.toBlob(b=>{if(!b){toast('Ошибка создания баннера');return}let url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Revenue_Guard_Story_'+t.id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Баннер PNG сохранён')},'image/png')}
function startVoice(){const B=window.SpeechRecognition||window.webkitSpeechRecognition;if(!B){toast('В этом браузере голосовой ввод недоступен. Введите задачу текстом.');return}if(speech&&recording){speech.stop();return}try{speech=new B();speech.lang='ru-RU';speech.interimResults=false;speech.maxAlternatives=1;speech.onstart=()=>{recording=true;document.getElementById('voiceButton')?.classList.add('recording');toast('Слушаю. Говорите задачу…')};speech.onresult=(event)=>{const text=event.results?.[0]?.[0]?.transcript||'';const el=document.getElementById('command');if(el){el.value=(el.value.trim()+' '+text).trim();draftText=el.value;toast('Речь распознана — проверьте текст')}};speech.onerror=(ev)=>toast(ev.error==='not-allowed'?'Разрешите доступ к микрофону для сайта':'Распознавание речи: '+ev.error);speech.onend=()=>{recording=false;document.getElementById('voiceButton')?.classList.remove('recording')};speech.start()}catch(err){toast('Не удалось включить микрофон: '+err.message)}}
function bind(){document.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>{if(tab==='home')draftText=document.getElementById('command')?.value||draftText;navigate(n.dataset.nav)});document.querySelectorAll('[data-open]').forEach(n=>{n.onclick=()=>{selectedId=n.dataset.open;navigate('tasks')};n.onkeydown=ev=>{if(ev.key==='Enter')n.click()}});document.querySelectorAll('[data-prompt]').forEach(n=>n.onclick=()=>{const el=document.getElementById('command');if(el){el.value=n.dataset.prompt;el.focus()}});
if(tab==='home'){document.getElementById('createTask').onclick=createTask;document.getElementById('voiceButton').onclick=startVoice}
if(tab==='tasks'){document.getElementById('backTasks')?.addEventListener('click',()=>{selectedId=null;render()});document.querySelectorAll('[data-choose]').forEach(n=>{n.onclick=()=>{const t=getTask();if(t.status==='published'){toast('Размещённая кампания заблокирована от изменений — создайте новую');return}if(t.chosen===Number(n.dataset.choose))return;t.chosen=Number(n.dataset.choose);delete t.creative;if(t.status==='approved')t.status='review';save();render()};n.onkeydown=ev=>{if(ev.key==='Enter')n.click()}});document.getElementById('submitReview')?.addEventListener('click',processStatus);document.getElementById('openCreative')?.addEventListener('click',()=>navigate('creative'));document.getElementById('regenerate')?.addEventListener('click',async()=>{if(busy)return;const t=getTask();if(t.status==='published'){toast('Размещённую кампанию нельзя перегенерировать');return}if(!confirm('Создать предложения заново? Текущие правки креативов этой задачи будут сброшены.'))return;busy=true;render();try{const res=await generateOffers(t.goal);t.offers=res.offers;t.source=res.source;t.chosen=0;delete t.creative;t.status='draft';save()}finally{busy=false;render()}})}
if(tab==='creative'){document.getElementById('creativeTask')?.addEventListener('change',ev=>{selectedId=ev.target.value;render()});const f=document.getElementById('creativeForm');if(f){f.addEventListener('input',()=>{const d=new FormData(f);document.getElementById('posterTitle').textContent=d.get('headline');document.getElementById('posterSub').textContent=d.get('subline');document.getElementById('posterCta').textContent=d.get('cta')});f.onsubmit=ev=>{ev.preventDefault();const t=getTask();if(t.status==='published'){toast('Нельзя изменить уже размещённую кампанию');render();return}const d=new FormData(f);t.creative=Object.fromEntries(['headline','subline','cta','caption','channel'].map(k=>[k,String(d.get(k)||'')]));if(t.status==='approved'||t.status==='published'){t.status='review';toast('Материал изменён: потребуется новое согласование')}else toast('Креатив сохранён');save();render()}}document.getElementById('downloadPoster')?.addEventListener('click',()=>{const f=document.getElementById('creativeForm');if(!f)return;const t=getTask();if(t.status==='published'){posterPNG();return}const d=new FormData(f);t.creative=Object.fromEntries(['headline','subline','cta','caption','channel'].map(k=>[k,String(d.get(k)||'')]));if(t.status==='approved'||t.status==='published'){t.status='review';toast('Креатив изменён: необходимо повторное согласование')}save();posterPNG();render()});document.getElementById('copyCaption')?.addEventListener('click',()=>copyText(document.querySelector('[name="caption"]')?.value||''))}
if(tab==='results'){const f=document.getElementById('saleForm');if(f)f.onsubmit=ev=>{ev.preventDefault();const d=new FormData(f),amount=Number(d.get('amount'));if(!Number.isFinite(amount)||amount<1||amount>1e7){toast('Проверь сумму оплаты');return}if(!d.get('verified')){toast('Нужно подтвердить факт визита и оплаты');return}if(!state.tasks.some(t=>t.id===d.get('campaign')&&t.status==='published')){toast('Кампания не отмечена как опубликованная');return}state.sales.push({id:'s'+Date.now(),campaign:d.get('campaign'),amount,verified:true,saleDate:d.get('saleDate')});save();render();toast('Подтверждённая продажа сохранена')};document.getElementById('exportSales')?.addEventListener('click',()=>{dlText('revenue_guard_sales.csv','\uFEFF'+'Кампания;Дата;Сумма;Подтверждено\r\n'+state.sales.map(s=>[state.tasks.find(t=>t.id===s.campaign)?.goal,s.saleDate,s.amount,s.verified?'Да':'Нет'].map(escCsv).join(';')).join('\r\n'),'text/csv;charset=utf-8')})}
if(tab==='profile'){const f=document.getElementById('profileForm');if(f)f.onsubmit=ev=>{ev.preventDefault();const d=new FormData(f);const services=String(d.get('services')||'');if(services.split('\n').length>30){toast('Максимум 30 услуг для демо');return}state.business=Object.fromEntries(['name','city','voice','budget','channels','services'].map(k=>[k,String(d.get(k)||'')]));save();render();toast('Профиль сохранён')};document.getElementById('backupState')?.addEventListener('click',()=>dlText('revenue_guard_demo_backup.json',JSON.stringify(state,null,2),'application/json'));document.getElementById('resetDemo')?.addEventListener('click',()=>{if(!confirm('Сбросить все локальные демо-данные? Отменить это действие нельзя.'))return;state=JSON.parse(JSON.stringify(DEFAULT));selectedId=null;save();navigate('home');toast('Демо сброшено')})}}
async function status(){aiEnabled=false;render()}
render();status();
})();
</script>
